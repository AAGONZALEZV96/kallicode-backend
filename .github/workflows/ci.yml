name: kallicode-backend-ci

on:
  pull_request:
    branches: [main, develop, testdev]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22.22.2"
  KC_ENV: local
  KC_DATABASE_URL: postgresql+asyncpg://kallicode_app:dev@localhost:5432/kallicode_test
  KC_DATABASE_URL_ADMIN: postgresql+asyncpg://kallicode_admin:dev@localhost:5432/kallicode_test
  KC_DATABASE_URL_WORKER: postgresql+asyncpg://kallicode_worker:dev@localhost:5432/kallicode_test
  KC_DATABASE_URL_MIGRATIONS: postgresql://postgres:dev@localhost:5432/kallicode_test
  KC_REDIS_URL: redis://localhost:6379/0
  KC_BLOB_ACCOUNT_URL: http://localhost:10000/devstoreaccount1
  KC_BLOB_CONTAINER_EVIDENCIA: evidencia
  KC_CLAMAV_HOST: localhost
  KC_CLAMAV_PORT: "3310"
  KC_CLAMAV_TIMEOUT_S: "60"

jobs:
  seguridad:
    name: Análisis de Seguridad
    runs-on: ubuntu-latest

    steps:
      - name: Checkout de código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: false

      - name: Preparar historial para Gitleaks
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          git fetch --no-tags --prune origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

          git fetch --no-tags origin "${BASE_SHA}" "${HEAD_SHA}"

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

          MERGE_BASE=$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")
          echo "MERGE_BASE=${MERGE_BASE}" >> "$GITHUB_ENV"
          echo "Rango de Gitleaks: ${MERGE_BASE}..${HEAD_SHA}"

      - name: Escaneo de Secretos (Gitleaks - PR)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source=/repo \
            --redact \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=/repo/results.sarif \
            --log-opts="${MERGE_BASE}..${HEAD_SHA}"

      - name: Escaneo de Secretos (push)
        if: github.event_name != 'pull_request'
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Escaneo de Código Estático (Semgrep)
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            semgrep/semgrep:latest \
            semgrep scan \
            --config p/ci \
            --error \
            --metrics=off

      - name: Escaneo de Vulnerabilidades (Trivy)
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            aquasec/trivy:latest fs /repo \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed

  matriz_proyectos:
    name: CI - ${{ matrix.proyecto }}
    runs-on: ubuntu-latest
    needs: seguridad

    strategy:
      fail-fast: false
      matrix:
        proyecto: [codemapping, database, backend, portal, testing]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: kallicode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kallicode_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout de código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Configurar uv y Python
        if: matrix.proyecto != 'portal'
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v3
        with:
          enable-cache: true

      - name: Setup Python
        if: matrix.proyecto != 'portal'
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configurar Node.js
        if: matrix.proyecto == 'portal'
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: kallicode-portal/package-lock.json

      - name: Instalar dependencias Python
        if: matrix.proyecto != 'portal'
        run: uv sync --all-packages

      - name: Instalar pg_partman en el servicio PostgreSQL
        if: matrix.proyecto != 'portal'
        shell: bash
        run: |
          pg_id="$(docker ps \
            --filter ancestor=pgvector/pgvector:pg16 \
            --format '{{.ID}}' | head -n1)"

          test -n "${pg_id}"

          docker exec -u root "${pg_id}" bash -c \
            "apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-16-partman"

      - name: Crear roles y extensiones de Base de Datos
        if: matrix.proyecto != 'portal'
        env:
          PGPASSWORD: dev
        run: |
          for i in 1 2; do
            psql -h localhost \
              -U postgres \
              -d kallicode_test \
              -v ON_ERROR_STOP=1 \
              -q \
              -v pw_app=dev \
              -v pw_worker=dev \
              -v pw_admin=dev \
              -f db/00_roles.sql
          done

          psql -h localhost \
            -U postgres \
            -d kallicode_test \
            -v ON_ERROR_STOP=1 \
            -q \
            -f db/00_extensiones.sql

      - name: Verificar roles de CI
        if: matrix.proyecto != 'portal'
        env:
          PGPASSWORD: dev
        run: |
          roles="$(
            psql -h localhost \
              -U postgres \
              -d kallicode_test \
              -v ON_ERROR_STOP=1 \
              -t -A \
              -c "SELECT rolname FROM pg_roles
                  WHERE rolname IN (
                    'kallicode_app',
                    'kallicode_admin',
                    'kallicode_worker',
                    'kallicode_dev'
                  )
                  ORDER BY rolname;"
          )"

          printf '%s\n' "${roles}"
          test "$(printf '%s\n' "${roles}" | sed '/^$/d' | wc -l)" -eq 4

      - name: Inyección de Esquemas Basales 01..05.sql
        if: matrix.proyecto != 'portal'
        env:
          PGPASSWORD: dev
        run: |
          for f in db/0[1-9]_*.sql; do
            echo ">> $f"
            psql -h localhost \
              -U kallicode_admin \
              -d kallicode_test \
              -v ON_ERROR_STOP=1 \
              -q \
              -f "$f"
          done

      - name: Ejecutar migraciones (migrate.py)
        if: matrix.proyecto != 'portal'
        run: uv run python packages/core/migrate.py

      - name: Validar idempotencia de migraciones (re-ejecución)
        if: matrix.proyecto == 'database'
        run: uv run python packages/core/migrate.py

      - name: Validar ledger SHA-256 de migraciones
        if: matrix.proyecto == 'database'
        env:
          PGPASSWORD: dev
        run: |
          TABLE_EXISTS="$(
            psql -h localhost \
              -U kallicode_admin \
              -d kallicode_test \
              -v ON_ERROR_STOP=1 \
              -t -A \
              -c "SELECT to_regclass('core.schema_migrations') IS NOT NULL;"
          )"

          if [ "${TABLE_EXISTS}" != "t" ]; then
            echo "ERROR: no existe core.schema_migrations."
            exit 1
          fi

          MIGRATIONS_COUNT="$(
            psql -h localhost \
              -U kallicode_admin \
              -d kallicode_test \
              -v ON_ERROR_STOP=1 \
              -t -A \
              -c "SELECT COUNT(*) FROM core.schema_migrations;"
          )"

          FILES_COUNT="$(find db/migrations -maxdepth 1 -name '*.sql' | wc -l)"

          echo "Migraciones registradas: ${MIGRATIONS_COUNT}"
          echo "Archivos de migración: ${FILES_COUNT}"

          test "${MIGRATIONS_COUNT}" -eq "${FILES_COUNT}"

      - name: Pruebas de base de datos
        if: matrix.proyecto == 'database'
        env:
          PGPASSWORD: dev
          PYTEST_ADDOPTS: "-ra --tb=long"
        run: |
          set -o pipefail

          uv run pytest \
            packages/core/tests/test_migraciones.py \
            packages/core/tests/integracion/test_migraciones.py \
            packages/core/tests/integracion/test_roles.py \
            packages/core/tests/integracion/test_rol_worker.py \
            packages/core/tests/integracion/test_validacion_v21.py \
            packages/core/tests/integracion/test_unicidad_tenant.py \
            packages/core/tests/integracion/test_fks_compuestas.py \
            packages/core/tests/integracion/test_cm_snapshots.py \
            packages/core/tests/integracion/test_vec_cm.py \
            packages/core/tests/integracion/test_cadena_auditoria.py \
            packages/core/tests/integracion/test_append_only_probatorias.py \
            packages/core/tests/integracion/test_cuota.py \
            packages/core/tests/integracion/test_auditoria_procedencia.py \
            packages/core/tests/integracion/test_indices_documentados.py \
            packages/core/tests/integracion/test_convencion_indices.py \
            packages/core/tests/integracion/test_particion_auditoria.py \
            packages/core/tests/integracion/test_particion_consumo.py \
            packages/core/tests/integracion/test_particion_colas.py \
            packages/core/tests/integracion/test_hnsw_parametros.py \
            -v \
            --junitxml=pytest-database.xml

      - name: Linter y Mypy - Python
        if: matrix.proyecto != 'portal' && matrix.proyecto != 'database'
        shell: bash
        run: |
          case "${{ matrix.proyecto }}" in
            backend)
              TARGETS=(apps/api apps/workers packages/core)
              ;;
            codemapping)
              TARGETS=(packages/codemapping)
              ;;
            testing)
              TARGETS=(packages/testing)
              ;;
          esac

          uv run ruff check "${TARGETS[@]}"
          uv run ruff format --check "${TARGETS[@]}"

          if [ "${{ matrix.proyecto }}" = "testing" ]; then
            uv run mypy packages/testing --strict
          else
            find "${TARGETS[@]}" \
              -type f \
              -name "*.py" \
              -print0 \
              | xargs -0 -r uv run mypy
          fi

      - name: Linter y TSC - Portal
        if: matrix.proyecto == 'portal'
        working-directory: kallicode-portal
        run: |
          npm ci
          npx eslint .
          npx tsc --noEmit

      - name: Levantar Azurite para integración
        if: matrix.proyecto == 'testing' || matrix.proyecto == 'backend'
        shell: bash
        run: |
          docker run -d \
            -p 10000:10000 \
            --name azurite-qa \
            mcr.microsoft.com/azure-storage/azurite \
            azurite-blob --blobHost 0.0.0.0

          for intento in $(seq 1 60); do
            if docker exec azurite-qa node -e '
              const net = require("net");
              const socket = net.connect(10000, "127.0.0.1", () => {
                socket.end();
                process.exit(0);
              });
              socket.on("error", () => process.exit(1));
              setTimeout(() => process.exit(1), 2000);
            '; then
              echo "Azurite disponible."
              exit 0
            fi

            sleep 2
          done

          docker logs azurite-qa
          exit 1

      - name: Preparar análisis de adjuntos
        if: matrix.proyecto == 'backend'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file

          docker run -d \
            -p 3310:3310 \
            --name clamav-backend \
            clamav/clamav:stable

          for intento in $(seq 1 120); do
            if docker exec clamav-backend clamdscan --ping 1; then
              echo "ClamAV disponible."
              exit 0
            fi

            sleep 5
          done

          docker logs clamav-backend
          exit 1

      - name: Free Disk Space (Limpieza de SDKs no utilizados)
        if: matrix.proyecto == 'testing'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Construir imagen kallicode-test-runner
        if: matrix.proyecto == 'testing'
        run: |
          docker build \
            -t kallicode-test-runner \
            -f packages/testing/Dockerfile.runner \
            .

      - name: Pruebas Pytest - Python
        if: matrix.proyecto != 'portal' && matrix.proyecto != 'database'
        shell: bash
        env:
          PGPASSWORD: dev
        run: |
          case "${{ matrix.proyecto }}" in
            backend)
              TARGETS=(apps/api apps/workers packages/core)
              ;;
            codemapping)
              TARGETS=(packages/codemapping)
              ;;
            testing)
              TARGETS=(packages/testing)
              ;;
          esac

          COV_ARGS=()

          for t in "${TARGETS[@]}"; do
            COV_ARGS+=(--cov="$t")
          done

          case "${{ matrix.proyecto }}" in
            codemapping)
              COV_MIN=70
              ;;
            testing)
              COV_MIN=80
              ;;
            *)
              COV_MIN=0
              ;;
          esac

          if [ "${{ matrix.proyecto }}" = "testing" ]; then
            uv run pytest packages/testing/ \
              --cov=packages/testing/src/kallicode_testing \
              --cov-branch \
              --cov-report=term-missing \
              --cov-report=xml \
              --cov-fail-under=80 \
              -v
          else
            uv run pytest \
              "${TARGETS[@]}" \
              "${COV_ARGS[@]}" \
              --cov-branch \
              --cov-report=term-missing \
              --cov-report=xml \
              --cov-fail-under="${COV_MIN}" \
              || [ $? -eq 5 ]
          fi

      - name: Pruebas de mutación - codemapping
        if: matrix.proyecto == 'codemapping'
        working-directory: packages/codemapping
        run: |
          uv run --with "mutmut>=3.8,<4" mutmut run
          uv run --with "mutmut>=3.8,<4" \
            python scripts/verificar_mutacion.py \
            --minimo 90

      - name: Pruebas de Integridad - Database
        if: matrix.proyecto == 'database'
        env:
          PGPASSWORD: dev
        run: |
          set -euo pipefail

          problems="$(
            psql -h localhost \
              -U kallicode_admin \
              -d kallicode_test \
              -v ON_ERROR_STOP=1 \
              -tA \
              -c "SELECT COALESCE(SUM(problemas), 0)
                  FROM core.validar_integridad()
                  WHERE problemas > 0;"
          )"

          echo "Problemas de integridad: ${problems}"
          test "${problems}" = "0"

      - name: Publicar resultado de pytest de base de datos
        if: always() && matrix.proyecto == 'database'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: pytest-database-results
          path: pytest-database.xml
          if-no-files-found: warn

      - name: Pruebas - Portal
        if: matrix.proyecto == 'portal'
        working-directory: kallicode-portal
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
        run: npm run test

      - name: Logs de servicios de integración
        if: failure() && (matrix.proyecto == 'testing' || matrix.proyecto == 'backend')
        shell: bash
        run: |
          if docker container inspect azurite-qa >/dev/null 2>&1; then
            docker logs --tail 150 azurite-qa
          fi

          if docker container inspect clamav-backend >/dev/null 2>&1; then
            docker logs --tail 150 clamav-backend
          fi

      - name: Subir reporte de cobertura
        if: always() && matrix.proyecto != 'portal' && matrix.proyecto != 'database'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: coverage-${{ matrix.proyecto }}
          path: coverage.xml
          if-no-files-found: ignore