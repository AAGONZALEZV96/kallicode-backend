name: kallicode-backend-ci

# KC-QA-B1-02: Workflow Unificado ci.yml para Monorepo con Matriz de Proyectos
# AC1: ejecución en paralelo por matriz en cada Pull Request      -> job matriz_proyectos
# AC2: inyección de esquemas 01..05.sql antes de correr pytest    -> step "Inyección de Esquemas Basales"

on:
  pull_request:
    branches: [main, develop, testdev]
  push:
    branches: [main,]

permissions:
  contents: read
  pull-requests: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "18"
  KC_DATABASE_URL: postgresql+asyncpg://kallicode_app:dev@localhost:5432/kallicode_test
  KC_DATABASE_URL_ADMIN: postgresql+asyncpg://kallicode_admin:dev@localhost:5432/kallicode_test
  KC_DATABASE_URL_WORKER: postgresql+asyncpg://kallicode_worker:dev@localhost:5432/kallicode_test
  KC_DATABASE_URL_MIGRATIONS: postgresql://postgres:dev@localhost:5432/kallicode_test
  KC_REDIS_URL: redis://localhost:6379/0
  KC_BOVEDA_CLAVE_LOCAL: "111122223333444455556666777788889999aaaabbbbccccddddeeeeffff0000" # pragma: allowlist secret - clave de prueba para servicios efímeros de CI
jobs:
  # ==========================================
  # ETAPA 1: SEGURIDAD Y CUMPLIMIENTO (EQA1)
  # ==========================================
  seguridad:
    name: Análisis de Seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: false

      # Fix aplicado en este chat: el refspec "BASE_SHA^:refs/..." es inválido
      # en un git fetch y quedaba enmascarado por "|| true". Se reemplaza por
      # merge-base, que no depende de resolver el padre de BASE_SHA.
      - name: Preparar historial para Gitleaks
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # 1. Trae la rama base completa (puede haber avanzado tras abrir la PR).
          git fetch --no-tags --prune origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

          # 2. Trae explícitamente los commits BASE y HEAD.
          git fetch --no-tags origin "${BASE_SHA}" "${HEAD_SHA}"

          # 3. Verificación explícita, sin fallback silencioso: si falta algo,
          #    que el job falle acá con un error de git claro, no en Gitleaks.
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

          # 4. No dependemos de BASE_SHA^: usamos el ancestro común real.
          MERGE_BASE=$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")
          echo "MERGE_BASE=${MERGE_BASE}" >> "$GITHUB_ENV"
          echo "OK: rango de Gitleaks será ${MERGE_BASE}..${HEAD_SHA}"

      - name: Escaneo de Secretos (Gitleaks - PR)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source=/repo \
            --redact \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=/repo/results.sarif \
            --log-opts="${MERGE_BASE}..${HEAD_SHA}"

      - name: Escaneo de Secretos (push)
        if: github.event_name != 'pull_request'
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Escaneo de Código Estático (Semgrep)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest \
            semgrep scan --config p/ci --error --metrics=off

      # Agregado: EQA1 pide explícitamente gitleaks + semgrep + trivy en CI.
      # Ejecución hermética vía contenedor Docker para evitar dependencias de red externas (get.trivy.dev)
      - name: Escaneo de Vulnerabilidades (Trivy)
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:latest fs /repo \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed

  # KC-CM-12-6: escaneos dirigidos a CodeMapping, la superficie más sensible (lee el repositorio y
  # la base productiva del cliente), y a su imagen, que hasta ahora no se construía en CI.
  # Detalle y excepciones: docs/seguridad/revision-cm-ga.md.
  seguridad_codemapping:
    name: Seguridad - codemapping (paquete e imagen)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # Semgrep solo reconoce un Dockerfile por su nombre: se escanea una copia llamada Dockerfile.
      - name: Semgrep (reglas de Python, secretos y Dockerfile)
        run: |
          mkdir -p "$RUNNER_TEMP/sg" && cp apps/workers/Dockerfile.codemapping "$RUNNER_TEMP/sg/Dockerfile"
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/sg:/sg" -w /src semgrep/semgrep:latest \
            semgrep scan --config p/python --config p/secrets --config p/dockerfile \
            --error --metrics=off \
            packages/codemapping/src /sg/Dockerfile

      - name: Gitleaks (árbol del paquete)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            dir /repo/packages/codemapping --config /repo/.gitleaks.toml \
            --redact --no-banner --exit-code 1

      - name: Construir la imagen del worker
        run: |
          docker build -f apps/workers/Dockerfile.codemapping \
            --build-arg GIT_SHA=${{ github.sha }} -t kallicode-codemapping:ci .

      - name: Trivy (imagen - vulnerabilidades y secretos)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --scanners vuln,secret --severity CRITICAL,HIGH --ignore-unfixed \
            --exit-code 1 kallicode-codemapping:ci

      - name: Trivy (configuración del Dockerfile)
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:latest \
            config --severity CRITICAL,HIGH --exit-code 1 /repo/apps/workers/Dockerfile.codemapping

      - name: Contenido y permisos de la imagen
        run: |
          docker run --rm --entrypoint sh kallicode-codemapping:ci -c '
            set -e
            test "$(id -u)" != 0                               || { echo "corre como root"; exit 1; }
            test ! -e /app/packages/codemapping/tests          || { echo "pruebas en la imagen"; exit 1; }
            test ! -e /app/packages/codemapping/test           || { echo "pruebas en la imagen"; exit 1; }
            test ! -w /app/packages/codemapping/src            || { echo "código escribible"; exit 1; }
            test ! -w /app/.venv                               || { echo "venv escribible"; exit 1; }
            test -w /app/workdir                               || { echo "workdir no escribible"; exit 1; }
            python -c "import kallicode_codemapping.worker, kallicode_codemapping.revision_logs, kallicode_codemapping.verificacion_acceso_cliente"
            echo "imagen OK"'

  # ==========================================
  # ETAPA 2: MATRIZ DE CALIDAD Y PRUEBAS (AC1 + AC2)
  # ==========================================
  matriz_proyectos:
    name: CI - ${{ matrix.proyecto }}
    runs-on: ubuntu-latest
    needs: seguridad
    strategy:
      fail-fast: false
      matrix:
        proyecto: [codemapping, database, backend, portal, testing]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: kallicode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kallicode_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout de código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # --- SETUP ENTORNO ---
      - name: Configurar uv y Python
        if: matrix.proyecto != 'portal'
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v3
        with:
          enable-cache: true

      - name: Setup Python
        if: matrix.proyecto != 'portal'
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configurar Node.js
        if: matrix.proyecto == 'portal'
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: kallicode-portal/package-lock.json

      - name: Instalar dependencias Python
        if: matrix.proyecto != 'portal'
        run: uv sync --all-packages

      # --- pg_partman (KC-DB-07-1) ---
      # El servicio es la imagen pgvector, que no incluye pg_partman. Se instala el paquete
      # (sin reiniciar: CREATE EXTENSION solo necesita los archivos). El worker de
      # mantenimiento (pg_partman_bgw) no se usa en CI: las pruebas ejecutan el mantenimiento a mano.
      # La imagen de desarrollo, con todo preinstalado, esta en db/postgres/Dockerfile.
      - name: Instalar pg_partman en el servicio PostgreSQL
        if: matrix.proyecto != 'portal'
        run: |
          pg_id="$(docker ps --filter ancestor=pgvector/pgvector:pg16 --format '{{.ID}}' | head -n1)"
          test -n "${pg_id}"
          docker exec -u root "${pg_id}" bash -c \
            "apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-16-partman"

      # --- INYECCIÓN DE ESQUEMAS DB (AC2 de KC-QA-B1-02) ---
      # --- ROLES Y EXTENSIONES (KC-DB-01-5) ---
      # Únicos pasos con superusuario. 00_roles.sql se aplica dos veces para
      # demostrar que es reejecutable.
      - name: Crear roles y extensiones de Base de Datos
        if: matrix.proyecto != 'portal'
        env:
          PGPASSWORD: dev
        run: |
          for i in 1 2; do
            psql -h localhost -U postgres -d kallicode_test -v ON_ERROR_STOP=1 -q \
                 -v pw_app=dev -v pw_worker=dev -v pw_admin=dev -f db/00_roles.sql
          done
          psql -h localhost -U postgres -d kallicode_test -v ON_ERROR_STOP=1 -q -f db/00_extensiones.sql

      - name: Verificar roles de CI
        if: matrix.proyecto != 'portal'
        env:
          PGPASSWORD: dev
        run: |
          roles="$(
            psql -h localhost -U postgres -d kallicode_test \
            -v ON_ERROR_STOP=1 \
            -t -A \
            -c "SELECT rolname FROM pg_roles
                WHERE rolname IN
                ('kallicode_app', 'kallicode_admin',
                 'kallicode_worker', 'kallicode_dev')
                ORDER BY rolname;"
          )"
          printf '%s\n' "${roles}"
          test "$(printf '%s\n' "${roles}" | sed '/^$/d' | wc -l)" -eq 4

      # El resto del esquema lo construye kallicode_admin (no superusuario).
      - name: Inyección de Esquemas Basales 01..05.sql
        if: matrix.proyecto != 'portal'
        env:
          PGPASSWORD: dev
        run: |
          for f in db/0[1-9]_*.sql; do
            echo ">> $f"
            psql -h localhost -U kallicode_admin -d kallicode_test -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # --- MIGRACIONES VERSIONADAS (KC-DB-01-1) ---
      # db/migrations/ se aplica SOLO con el runner: verifica el sha256 de lo
      # ya aplicado, una transacción por archivo y registra en el ledger.
      # Todas las patas con Python prueban contra el esquema completo
      # (p. ej. las políticas de kallicode_worker de 010_rol_worker.sql).
      - name: Ejecutar migraciones (migrate.py)
        if: matrix.proyecto != 'portal'
        run: uv run python packages/core/migrate.py

      - name: Validar idempotencia de migraciones (re-ejecución)
        if: matrix.proyecto == 'database'
        run: |
          # Una segunda ejecución no debe alterar esquemas ni fallar.
          uv run python packages/core/migrate.py

      - name: Validar ledger SHA-256 de migraciones
        if: matrix.proyecto == 'database'
        env:
          PGPASSWORD: dev
        run: |
          TABLE_EXISTS=$(psql -h localhost -U kallicode_admin -d kallicode_test -t -A -c "SELECT to_regclass('core.schema_migrations') IS NOT NULL;")
          if [ "$TABLE_EXISTS" != "t" ]; then
            echo "ERROR: migrate.py no creó la tabla core.schema_migrations."
            exit 1
          fi

          MIGRATIONS_COUNT=$(psql -h localhost -U kallicode_admin -d kallicode_test -t -A -c "SELECT COUNT(*) FROM core.schema_migrations;")
          FILES_COUNT=$(ls db/migrations/*.sql 2>/dev/null | wc -l)
          echo "Migraciones registradas en ledger: $MIGRATIONS_COUNT / archivos: $FILES_COUNT"
          if [ "$MIGRATIONS_COUNT" -ne "$FILES_COUNT" ]; then
            echo "ERROR: el ledger no coincide con db/migrations/."
            exit 1
          fi

      # KC-DB-12-1: smoke post-deploy del esquema. Como kallicode_app (el rol de la API): la versión
      # que expone core.version_esquema() es la de la instantánea congelada y la última migración
      # aplicada es la última del repo. El mismo script se ejecuta tras cada despliegue
      # (docs/politica-cambios-esquema.md).
      - name: Smoke post-deploy del esquema (versión v2)
        if: matrix.proyecto == 'database'
        env:
          PGPASSWORD: dev
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("db/esquema_v2.snapshot.json"))["etiqueta"])')"
          ULTIMA="$(ls db/migrations/*.sql | sort | tail -n1 | xargs basename)"
          psql -h localhost -U kallicode_app -d kallicode_test -v ON_ERROR_STOP=1 \
               -v version_esperada="${VERSION}" -v ultima_migracion="${ULTIMA}" \
               -f db/tools/smoke_post_deploy.sql

      # KC-DB-12-5: smoke de release (aceptación de GA). Con el rol administrador comprueba versión del esquema, migraciones
      # aplicadas y en orden, los 26 chequeos en cero, la cadena de auditoría de todos los tenants y cero tablas sin política.
      # El mismo script se ejecuta en el despliegue sobre staging (docs/aceptacion_ga_esquema.md).
      - name: Smoke de release del esquema (GA)
        if: matrix.proyecto == 'database'
        env:
          PGPASSWORD: dev
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("db/esquema_v2.snapshot.json"))["etiqueta"])')"
          ULTIMA="$(ls db/migrations/*.sql | sort | tail -n1 | xargs basename)"
          NUMERO="$(ls db/migrations/*.sql | wc -l)"
          psql -h localhost -U kallicode_admin -d kallicode_test -v ON_ERROR_STOP=1 \
               -v version_esperada="${VERSION}" -v ultima_migracion="${ULTIMA}" -v migraciones="${NUMERO}" \
               -f db/tools/smoke_release.sql

      # KC-DB-12-2: el modelo de datos se documenta desde pg_catalog. Falla si una tabla, columna o
      # constraint no lleva COMMENT, o si docs/modelo_datos_v2.md difiere del catálogo (se regenera con
      # db/tools/documentar_esquema.py).
      - name: Documentación del modelo v2 (COMMENT y copia versionada)
        if: matrix.proyecto == 'database'
        run: |
          set -euo pipefail
          uv run python db/tools/documentar_esquema.py --cobertura
          uv run python db/tools/documentar_esquema.py --comprobar

      # KC-CM-12-3: el catálogo de nodos y aristas del grafo sale del esquema cm. Falla si
      # docs/catalogo_grafo_cm.md difiere de lo generado o si node_types, edge_types, los CHECK de
      # cm.edges y los triggers de cm.nodes se contradicen (se regenera con db/tools/catalogo_grafo_cm.py).
      - name: Catálogo de nodos y aristas del grafo (esquema cm)
        if: matrix.proyecto == 'database'
        run: uv run python db/tools/catalogo_grafo_cm.py --comprobar

      - name: Pruebas de base de datos
        if: matrix.proyecto == 'database'
        env:
          PGPASSWORD: dev
          PYTEST_ADDOPTS: "-ra --tb=long"
        run: |
          set -o pipefail

          uv run pytest packages/core/tests/integracion/test_esquema_congelado.py \
                        packages/core/tests/integracion/test_documentacion_modelo.py \
                        packages/core/tests/integracion/test_catalogo_grafo_cm.py \
                        packages/core/tests/test_migraciones.py \
                        packages/core/tests/integracion/test_migraciones.py \
                        packages/core/tests/integracion/test_roles.py \
                        packages/core/tests/integracion/test_aislamiento.py \
                        packages/core/tests/integracion/test_auditoria_rls.py \
                        packages/core/tests/integracion/test_penetracion_tenants.py \
                        packages/core/tests/integracion/test_aceptacion_ga.py \
                        packages/core/tests/integracion/test_rol_worker.py \
                        packages/core/tests/integracion/test_validacion_v21.py \
                        packages/core/tests/integracion/test_unicidad_tenant.py \
                        packages/core/tests/integracion/test_fks_compuestas.py \
                        packages/core/tests/integracion/test_cm_snapshots.py \
                        packages/core/tests/integracion/test_vec_cm.py \
                        packages/core/tests/integracion/test_cadena_auditoria.py \
                        packages/core/tests/integracion/test_append_only_probatorias.py \
                        packages/core/tests/integracion/test_cuota.py \
                        packages/core/tests/integracion/test_auditoria_procedencia.py \
                        packages/core/tests/integracion/test_indices_documentados.py \
                        packages/core/tests/integracion/test_convencion_indices.py \
                        packages/core/tests/integracion/test_particion_auditoria.py \
                        packages/core/tests/integracion/test_particion_consumo.py \
                        packages/core/tests/integracion/test_particion_colas.py \
                        packages/core/tests/integracion/test_hnsw_parametros.py \
                        packages/core/tests/integracion/test_hnsw_concurrente.py \
                        packages/core/tests/integracion/test_halfvec.py \
                        packages/core/tests/integracion/test_pipeline_visible.py \
                        packages/core/tests/integracion/test_checks_dominio.py \
                        packages/core/tests/integracion/test_gate_pendiente_escalado.py \
                        packages/core/tests/integracion/test_validacion_ampliada.py \
                        packages/core/tests/integracion/test_retencion_purgas.py \
                        packages/core/tests/integracion/test_export_worm.py \
                        packages/core/tests/integracion/test_ttl_pii.py \
                        packages/core/tests/integracion/test_ensayo_retencion.py \
                        packages/core/tests/integracion/test_recuperacion_pitr.py \
                        packages/core/tests/integracion/test_recuperacion_cm.py \
                        packages/core/tests/integracion/test_runbook_incidentes.py \
                        packages/core/tests/integracion/test_informe_retencion.py \
                        packages/core/tests/integracion/test_cm_reachability.py \
                        -v --junitxml=pytest-database.xml

      # --- LINTING Y TIPOS ---
      - name: Linter y Mypy - Python
        if: matrix.proyecto != 'portal' && matrix.proyecto != 'database'
        shell: bash
        run: |
          case "${{ matrix.proyecto }}" in
            backend)     TARGETS=(apps/api apps/workers packages/core) ;;
            codemapping) TARGETS=(packages/codemapping) ;;
            testing)     TARGETS=(packages/testing) ;;
          esac

          uv run ruff check "${TARGETS[@]}"
          uv run ruff format --check "${TARGETS[@]}"
          if [ "${{ matrix.proyecto }}" = "testing" ]; then
            uv run mypy packages/testing --strict
          else
            find "${TARGETS[@]}" -type f -name "*.py" -print0 | xargs -0 -r uv run mypy
          fi

      - name: Linter y TSC - Portal
        if: matrix.proyecto == 'portal'
        working-directory: kallicode-portal
        run: |
          npm ci
          npx eslint .
          npx tsc --noEmit

      # --- PRUEBAS UNITARIAS E INTEGRACIÓN ---
      - name: Levantar infraestructura efímera (Azurite)
        if: matrix.proyecto == 'testing' || matrix.proyecto == 'backend'
        shell: bash
        run: |
          set -euo pipefail

          docker run -d \
            -p 127.0.0.1:10000:10000 \
            --name azurite-qa \
            mcr.microsoft.com/azure-storage/azurite \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck

          for intento in {1..30}; do
            if curl --silent \
              --output /dev/null \
              --connect-timeout 2 \
              --max-time 3 \
              http://127.0.0.1:10000/; then
              echo "Azurite disponible"
              exit 0
            fi
            sleep 2
          done

          docker logs azurite-qa
          echo "Azurite no arrancó dentro del tiempo esperado"
          exit 1

      - name: Levantar infraestructura efímera (Mailpit)
        if: matrix.proyecto == 'testing' || matrix.proyecto == 'backend'
        shell: bash
        run: |
          set -euo pipefail

          docker run -d \
            -p 1025:1025 \
            -p 8025:8025 \
            --name mailpit-ci \
            axllent/mailpit

          for intento in {1..30}; do
            if curl --silent \
              --output /dev/null \
              --connect-timeout 2 \
              --max-time 3 \
              http://127.0.0.1:8025/api/v1/info; then
              echo "Mailpit disponible"
              exit 0
            fi
            sleep 2
          done

          docker logs mailpit-ci
          echo "Mailpit no arrancó dentro del tiempo esperado"
          exit 1

    # --- SRE FIX: LIBERACIÓN DE ESPACIO EN DISCO (PREVENCIÓN ERROR 28) ---
      - name: Free Disk Space (Limpieza de SDKs no utilizados)
        if: matrix.proyecto == 'testing'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      # --- CONSTRUCCIÓN DE IMAGEN PARA SANDBOX (KC-QA-B2-05) ---
      - name: Construir imagen kallicode-test-runner
        if: matrix.proyecto == 'testing'
        run: docker build -t kallicode-test-runner -f packages/testing/Dockerfile.runner .
        
      - name: M3 - Pipeline hasta Gate 1 firmado (KC-BE-06-6)
        if: matrix.proyecto == 'backend'
        timeout-minutes: 3
        run: timeout --kill-after=5s 175s uv run pytest tests/e2e/test_pipeline_hasta_gate1.py -v --junitxml=pytest-m3.xml

      - name: M4 - Contrato y latencia del expediente (KC-BE-08-6)
        if: matrix.proyecto == 'backend'
        timeout-minutes: 3
        run: uv run pytest tests/integracion/test_expediente_completo.py -v

      - name: Flujo de mejora de plan (KC-BE-09-4)
        if: matrix.proyecto == 'backend'
        timeout-minutes: 3
        run: uv run pytest tests/integracion/test_planes.py -v

      - name: Pruebas Pytest - Python
        if: matrix.proyecto != 'portal' && matrix.proyecto != 'database'
        shell: bash
        env:
          PGPASSWORD: dev
        run: |
          case "${{ matrix.proyecto }}" in
            backend)     TARGETS=(apps/api apps/workers packages/core) ;;
            codemapping) TARGETS=(packages/codemapping) ;;
            testing)     TARGETS=(packages/testing) ;;
          esac

          COV_ARGS=()
          for t in "${TARGETS[@]}"; do
            COV_ARGS+=(--cov="$t")
          done
          # KC-CM-06-6 / KC-CM-12-2: compuerta de codemapping en 90 % (medido: 93,8 %; la regla es
          # que sube y nunca baja). El resto de los proyectos mantiene fail-under=0 temporal y se
          # ignora el exit code 5 (sin tests) ##### SACAR DESPUES ###
          case "${{ matrix.proyecto }}" in
            codemapping) COV_MIN=90 ;;
            testing)     COV_MIN=80 ;;
            *)           COV_MIN=0 ;;
          esac
          if [ "${{ matrix.proyecto }}" = "testing" ]; then
            uv run pytest packages/testing/ --cov=packages/testing/src/kallicode_testing --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=80 -v
          elif [ "${{ matrix.proyecto }}" = "codemapping" ]; then
            # KC-CM-12-2: -rs lista cada prueba saltada y KC_CM_CUARENTENA_ESTRICTA hace fallar
            # toda prueba no ejecutada que no esté en packages/codemapping/tests/cuarentena.yaml
            # (con ticket y fecha de resolución). Después, compuerta por ámbito (consulta,
            # cargador, aislamiento) sobre el mismo coverage.xml.
            KC_CM_CUARENTENA_ESTRICTA=1 uv run pytest packages/codemapping --cov=packages/codemapping --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under="${COV_MIN}" -rs
            uv run python packages/codemapping/scripts/verificar_cobertura_modulos.py coverage.xml --minimo 90
          else
            uv run pytest "${TARGETS[@]}" "${COV_ARGS[@]}" --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under="${COV_MIN}" || [ $? -eq 5 ]
          fi

      # KC-CM-06-6: pruebas de mutación (mutmut) sobre la lógica pura de codemapping.
      # La corrida es corta (~15 s) y exige >= 90 % de mutantes muertos.
      - name: Pruebas de mutación - codemapping
        if: matrix.proyecto == 'codemapping'
        working-directory: packages/codemapping
        run: |
          uv run --with "mutmut>=3.8,<4" mutmut run
          uv run --with "mutmut>=3.8,<4" python scripts/verificar_mutacion.py --minimo 90

      - name: Pruebas de Integridad - Database
        if: matrix.proyecto == 'database'
        env:
          PGPASSWORD: dev
        run: |
          set -euo pipefail

          problems="$(
            psql -h localhost -U kallicode_admin -d kallicode_test \
              -v ON_ERROR_STOP=1 -tA \
              -c "SELECT COALESCE(SUM(problemas), 0)
                  FROM core.validar_integridad()
                  WHERE problemas > 0;"
          )"

          echo "Problemas de integridad: ${problems}"
          test "${problems}" = "0"

      # KC-DB-10-6: ensayo integral de retención (pg_cron definido, purga, export WORM, DROP con ancla,
      # TTL de idempotencia, minimización de PII, integridad final). Evidencia reproducible: informe + exports.
      - name: Ensayo integral de retención - Database
        if: matrix.proyecto == 'database'
        run: |
          set -euo pipefail
          uv run python db/tools/ensayo_retencion.py --destino evidencia-retencion/exports --informe evidencia-retencion/informe.md

      - name: Publicar evidencia del ensayo de retención
        if: always() && matrix.proyecto == 'database'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: evidencia-ensayo-retencion
          path: evidencia-retencion/
          if-no-files-found: warn

      # KC-DB-10-4: informe de cumplimiento de retención tras el ciclo completo (purgas 10-1 con el gancho WORM de
      # 10-2, TTL y minimización de PII 10-3). Falla si queda alguna alerta (dato más antiguo > retención + 7 días)
      # o algún hallazgo de core.validar_integridad(), V26 incluido. El informe se publica siempre como artefacto.
      - name: Informe de cumplimiento de retención - Database
        if: matrix.proyecto == 'database'
        env:
          PGHOST: localhost
          PGUSER: kallicode_admin
          PGDATABASE: kallicode_test
          PGPASSWORD: dev
        run: bash db/tools/informe_retencion.sh informe-retencion

      - name: Publicar informe de cumplimiento de retención
        if: always() && matrix.proyecto == 'database'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: informe-retencion
          path: informe-retencion/
          if-no-files-found: warn

      - name: Publicar resultado de pytest de base de datos
        if: always() && matrix.proyecto == 'database'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: pytest-database-results
          path: pytest-database.xml
          if-no-files-found: warn

      - name: Pruebas - Portal
        if: matrix.proyecto == 'portal'
        working-directory: kallicode-portal
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
        run: |
          npm run test --if-present || echo "⚠️ Tests de portal omitidos: Entorno Vitest/ESM roto por el Equipo 4 (KC-PT-01-2)"

      # --- REPORTES ---
      - name: Subir reporte de cobertura
        if: always() && matrix.proyecto != 'portal' && matrix.proyecto != 'database'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: coverage-${{ matrix.proyecto }}
          path: coverage.xml
          if-no-files-found: ignore
