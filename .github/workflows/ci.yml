name: kallicode-backend

# Control de ejecución por ramas estratégicas
on:
  pull_request:
    branches: [main, develop, testdev]
  push:
    branches: [main, develop, testdev]

permissions:
  contents: read
  pull-requests: read

env:
  PYTHON_VERSION: "3.12"
  # CORRECCIÓN: Contraseña unificada a "dev" para coincidir con los servicios
  KC_DATABASE_URL: postgresql+asyncpg://kallicode_app:dev@localhost:5432/kallicode_test
  KC_DATABASE_URL_MIGRATIONS: postgresql://postgres:dev@localhost:5432/kallicode_test
  KC_REDIS_URL: redis://localhost:6379/0

jobs:
  # ==========================================
  # ETAPA 1: SEGURIDAD Y CUMPLIMIENTO
  # ==========================================
  seguridad:
    name: Análisis de Seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar rama base para Gitleaks
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Escaneo de Secretos (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Escaneo de Código Estático (Semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/python
  # ==========================================
  # ETAPA 2: CALIDAD DE CÓDIGO
  # ==========================================
  calidad:
    name: Estilo, Formato y Tipos
    runs-on: ubuntu-latest
    needs: seguridad
    steps:
      - name: Checkout de código
        uses: actions/checkout@v4

      - name: Configurar uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      
      # CORRECCIÓN: Aseguramos la versión de Python definida en env
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Linter y Formato (Ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Validación de Tipos (Mypy)
        run: |
          uv run mypy .

  # ==========================================
  # ETAPA 3: PRUEBAS UNITARIAS
  # ==========================================
  unitarias:
    name: Pruebas Unitarias
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - name: Checkout de código
        uses: actions/checkout@v4

      - name: Configurar uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sincronizar dependencias
        run: uv sync --all-packages

      - name: Pytest Unitarias
        run: |
          uv run pytest -m "not integracion" --cov=packages/core --cov-report=term-missing --cov-fail-under=0
          
      # CORRECCIÓN: Guardamos la cobertura unitaria para la siguiente etapa
      - name: Guardar estado de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unitarias
          path: .coverage
          include-hidden-files: true

  # ==========================================
  # ETAPA 4: INTEGRACIÓN Y AISLAMIENTO MULTI-TENANT
  # ==========================================
  integracion:
    name: Integración, RLS e Inmutabilidad
    runs-on: ubuntu-latest
    needs: unitarias
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: kallicode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready 
          --health-interval 5s 
          --health-timeout 5s 
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" 
          --health-interval 5s 
          --health-timeout 5s 
          --health-retries 10

    steps:
      - name: Checkout de código
        uses: actions/checkout@v4

      - name: Configurar uv y Python
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Sincronizar dependencias
        run: uv sync --all-packages

      # CORRECCIÓN: Descargamos la cobertura de las pruebas unitarias
      - name: Descargar cobertura unitaria
        uses: actions/download-artifact@v4
        with:
          name: coverage-unitarias

      - name: Crear roles, permisos y extensiones
        env:
          PGPASSWORD: dev
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE kallicode_app WITH LOGIN PASSWORD 'dev';"
          psql -h localhost -U postgres -c "CREATE ROLE kallicode_admin WITH LOGIN PASSWORD 'dev' BYPASSRLS;"

          psql -h localhost -U postgres -d kallicode_test -c "GRANT ALL ON DATABASE kallicode_test TO kallicode_admin;"
          psql -h localhost -U postgres -d kallicode_test -c "GRANT ALL ON SCHEMA public TO kallicode_admin;"
          
          psql -h localhost -U postgres -d kallicode_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          psql -h localhost -U postgres -d kallicode_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Aplicar Esquemas Basales
        env:
          PGPASSWORD: dev
        run: |
          psql -h localhost -U kallicode_admin -d kallicode_test -v ON_ERROR_STOP=1 < db/01_schema.sql
          psql -h localhost -U kallicode_admin -d kallicode_test -v ON_ERROR_STOP=1 < db/02_indexes.sql
          psql -h localhost -U kallicode_admin -d kallicode_test -v ON_ERROR_STOP=1 < db/03_triggers.sql
          psql -h localhost -U kallicode_admin -d kallicode_test -v ON_ERROR_STOP=1 < db/04_rls.sql
          psql -h localhost -U postgres -d kallicode_test -c "GRANT ALL ON SCHEMA core, vec, audit TO kallicode_admin;"
          psql -h localhost -U postgres -d kallicode_test -c "GRANT CREATE ON DATABASE kallicode_test TO kallicode_admin;"

      - name: Ejecutar Migraciones
        env:
          KC_DATABASE_URL_ADMIN: postgresql+asyncpg://kallicode_admin:dev@localhost:5432/kallicode_test
        run: |
          uv run python packages/core/migrate.py
      # ------------------------------------------------------------------------
      # VERIFICACIÓN DE IDEMPOTENCIA Y LEDGER SHA-256 (Candado SRE)
      # ------------------------------------------------------------------------
      - name: Validar Idempotencia de Migraciones (Re-ejecución)
        env:
          KC_DATABASE_URL_ADMIN: postgresql+asyncpg://kallicode_admin:dev@localhost:5432/kallicode_test
          PYTHONPATH: packages/core/src
        run: |
          # Una segunda ejecución no debe alterar esquemas ni fallar
          uv run python packages/core/migrate.py

      - name: Diagnosticar estructura de base de datos
        env:
          PGPASSWORD: dev
        run: |
          echo "Tablas creadas en el esquema core:"
          psql -h localhost -U kallicode_admin -d kallicode_test -c "\dt core.*"

      - name: Validar Registro de Hashes SHA-256 en Tabla de Control
        env:
          PGPASSWORD: dev
        run: |
          # 1. Verificar si la tabla realmente fue creada por el script
          TABLE_EXISTS=$(psql -h localhost -U kallicode_admin -d kallicode_test -t -A -c "SELECT to_regclass('core.schema_migrations') IS NOT NULL;")
          
          if [ "$TABLE_EXISTS" != "t" ]; then
            echo "ERROR: El script migrate.py no creó la tabla core.schema_migrations."
            exit 1
          fi

          # 2. Verificar que se hayan registrado archivos en el ledger
          MIGRATIONS_COUNT=$(psql -h localhost -U kallicode_admin -d kallicode_test -t -A -c "SELECT COUNT(*) FROM core.schema_migrations;")
          echo "Migraciones registradas en ledger: $MIGRATIONS_COUNT"
          
          if [ "$MIGRATIONS_COUNT" -eq 0 ]; then
            echo "ERROR: El ledger existe, pero no contiene migraciones (el script no procesó archivos)."
            exit 1
          fi

      - name: Pytest de Integración
        env:
          KC_DATABASE_URL_ADMIN: postgresql+asyncpg://kallicode_admin:dev@localhost:5432/kallicode_test
        run: |
          # Ahora el --cov-append sí tendrá el archivo .coverage de las unitarias
          uv run pytest -m "integracion" --cov=packages/core --cov-append --cov-report=xml

      - name: Validación de Integridad
        env:
          PGPASSWORD: dev
        run: |
          psql -h localhost -U kallicode_admin -d kallicode_test -c "SELECT * FROM core.validar_integridad() WHERE problemas > 0;"
          
      - name: Subir reporte XML unificado
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-cobertura-backend
          path: coverage.xml