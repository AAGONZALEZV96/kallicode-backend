version: 1

changes:
  - id: KC-BE-03-5-initial-contracts
    status: approved
    breaking: false
    surfaces:
      - api-v1
      - internal-v1
    description: >
      Publicación inicial de los contratos OpenAPI versionados del Portal,
      Testing y CodeMapping.
    consumer_approval:
      portal: pending
      testing: pending
      codemapping: pending
    approved_by: []
  - id: KC-CM-07-3-api-curacion
    status: proposed
    breaking: false
    surfaces:
      - api-v1
    description: >
      Alta de la API de curación de CodeMapping: GET /codemapping/curation,
      GET /codemapping/curation/selectores, GET /codemapping/curation/{item_id} y
      POST /codemapping/curation/{item_id}/decision. Cambio aditivo (solo endpoints nuevos);
      no modifica los existentes. El texto del LLM sale saneado y la UI debe pintarlo como texto.
    consumer_approval:
      portal: pending
      testing: pending
      codemapping: pending
    approved_by: []
  - id: KC-PT-05-5-selectores-portal-v1
    status: proposed
    breaking: false
    surfaces:
      - selectores-portal-v1
    description: >
      Congelación de los selectores data-testid del portal (vista.zona.elemento) en
      contratos/selectores-portal-v1.json: 197 selectores en 15 vistas, con tipo, acción,
      descripción y condición. La matriz de interacción legible está en
      kallicode-portal/docs/matriz-interaccion.md. Desde v1, renombrar o quitar un selector
      es breaking y requiere la aprobación de Testing; agregar no lo es.
    consumer_approval:
      portal: approved
      testing: pending
    approved_by: []
  - id: KC-PT-06-1-selectores-bandeja-notificaciones
    status: proposed
    breaking: false
    surfaces:
      - selectores-portal-v1
    description: >
      Bandeja de notificaciones: agrega layout.cabecera.campana y la vista
      bandeja-notificaciones (panel, leer-todas y por notificación item, abrir, alternar y
      vacio). layout.cabecera.notificaciones se mantiene: ahora es el contador dentro de la
      campana. Solo agrega selectores (204 en 16 vistas).
    consumer_approval:
      portal: approved
      testing: pending
    approved_by: []
  - id: KC-PT-06-7-modal-firma-gates
    status: proposed
    breaking: false
    surfaces:
      - selectores-portal-v1
    description: >
      Modal de firma de gates: agrega detalle-ticket.firma.* (dialogo, resumen, cancelar,
      confirmar, resultado, sello, aviso-cuota y cerrar). Ningún selector cambia de nombre,
      pero sí el flujo: detalle-ticket.gate.aprobar y pedir-cambios ahora abren el modal y la
      decisión se envía con detalle-ticket.firma.confirmar. Las pruebas de Testing que firmaban
      con un solo clic necesitan ese paso extra. 212 selectores en 16 vistas.
    consumer_approval:
      portal: approved
      testing: pending
    approved_by: []
  - id: KC-PT-05-2-galeria-evidencia
    status: proposed
    breaking: false
    surfaces:
      - selectores-portal-v1
    description: >
      Galería de evidencia QA en la pestaña Evidencia del detalle: agrega
      detalle-ticket.evidencia.* (galeria, galeria-vacia, item, miniatura, ver-video, descargar,
      no-disponible y renovando) y el diálogo del video detalle-ticket.video.* (dialogo,
      reproductor, descargar y cerrar). Solo agrega selectores: 224 en 16 vistas. El portal
      espera download_url y expira_en en cada elemento de matriz[].evidencias de
      GET /api/v1/tickets/{numero}/evidence; mientras el backend no los envíe (KC-BE-08-5),
      cada evidencia aparece con detalle-ticket.evidencia.no-disponible.
    consumer_approval:
      portal: approved
      testing: pending
    approved_by: []
  - id: KC-PT-06-4-cadena-firmas
    status: proposed
    breaking: false
    surfaces:
      - selectores-portal-v1
    description: >
      Cadena de firmas en el detalle del ticket: agrega detalle-ticket.firmas.* (cadena, gate,
      estado, sello y expediente). Solo agrega selectores: 229 en 16 vistas. Consume
      GET /api/v1/tickets/{numero}/gates con la forma de gates.estado_gates; el contrato api-v1
      declara esa respuesta como objeto libre, así que el portal la valida con
      CadenaFirmasEsquema.
    consumer_approval:
      portal: approved
      testing: pending
    approved_by: []
  - id: KC-PT-06-5-errores-por-campo-y-cancelacion
    status: proposed
    breaking: false
    surfaces:
      - selectores-portal-v1
    description: >
      Errores por campo en Nuevo ticket y Nueva funcionalidad (nuevo-ticket.errores.*,
      nueva-funcionalidad.errores.* y nueva-funcionalidad.criterios.error) y modal de
      cancelación (detalle-ticket.cancelacion.*: dialogo, motivo, error, volver y confirmar).
      Ningún selector cambia de nombre, pero sí dos flujos: detalle-ticket.acciones.cancelar
      ahora abre el modal en vez del prompt() del navegador, así que las pruebas que aceptaban
      el diálogo nativo deben escribir en detalle-ticket.cancelacion.motivo y pulsar
      detalle-ticket.cancelacion.confirmar; y los formularios ya no usan la validación
      nativa del navegador (noValidate): un campo inválido se marca con aria-invalid y su
      mensaje. 242 selectores en 16 vistas.
    consumer_approval:
      portal: approved
      testing: pending
    approved_by: []
  - id: KC-PT-06-6-que-pasa-despues-y-vista-previa
    status: proposed
    breaking: false
    surfaces:
      - selectores-portal-v1
    description: >
      Alta de trabajo: panel «¿Qué pasa después de enviar?» en Nuevo ticket y Nueva
      funcionalidad (<vista>.que-pasa.panel y .paso) y vista previa de la spec en Nueva
      funcionalidad (nueva-funcionalidad.vista-previa.*: panel, vacio, nombre, objetivo y
      criterio). Solo agrega selectores: 251 en 16 vistas.
    consumer_approval:
      portal: approved
      testing: pending
    approved_by: []
  - id: KC-CM-08-3-cm-consulta-v1
    status: proposed
    breaking: false
    surfaces:
      - cm-consulta-v1
    description: >
      Alta del contrato cm-consulta-v1 (contratos/cm-consulta-v1.schema.json): resolución de
      {{nuggets}}, {{module_conventions}} y {{nuggets_for_file}} para las plantillas del pipeline.
      Fuente única en kallicode_core.cm_consulta (modelos ConsultaNuggetsIn/ConsultaNuggetsOut y
      resolver_nuggets async para Backend). Solo nuggets aprobados del tenant de la sesión, orden
      determinista y recorte por reglas enteras al presupuesto. Cambio aditivo. Además, en api-v1,
      POST /codemapping/curation/{item_id}/decision resuelve los elementos tipo nugget con
      cm.resolver_nugget (misma forma de petición y respuesta).
    consumer_approval:
      backend: pending
      codemapping: approved
    approved_by: []
  - id: KC-CM-09-2-cm-incidentes-v1
    status: proposed
    breaking: false
    surfaces:
      - cm-incidentes-v1
    description: >
      Alta del contrato cm-incidentes-v1 (contratos/cm-incidentes-v1.schema.json): memoria de
      incidentes del cliente y resolución de {{incidents}} para las plantillas del pipeline.
      Fuente única en kallicode_core.cm_incidentes (RegistroIncidenteIn/Out, ConsultaIncidentesIn/
      Out y resolver_incidentes async para Backend). Registro idempotente por ticket desde el
      expediente (kallicode_codemapping.incidentes.registrar_desde_expediente, punto de entrada de
      KC-BE-09-4). Solo incidentes del tenant de la sesión enlazados a nodos a <= 2 saltos del área;
      orden por distancia, similitud, recencia e id; recorte por incidentes enteros; "" si no hay.
      Cambio aditivo (migración 047: columnas nuevas con default, cm.incident_nodes y
      vec.incident_embeddings).
    consumer_approval:
      backend: pending
      codemapping: approved
    approved_by: []
  - id: KC-CM-09-4-cm-grafo-v1
    status: proposed
    breaking: false
    contrato_version: "1.0.0"
    surfaces:
      - cm-grafo-v1
    description: >
      Congelación del contrato v1 de la API de consulta del grafo (contratos/cm-grafo-v1.json,
      fuente única kallicode_core.cm_grafo): 10 operaciones del protocolo ConsultaGrafo
      (resolver_nodos, semillas, impacto, dependencias, subgrafo, vecinos, dependencias_ocultas,
      buscar_hibrido, resolver_nuggets, resolver_incidentes) con entrada y salida en JSON Schema
      (additionalProperties: false), presupuesto de latencia p95 por operación verificado en el CI
      y política de versionado (SemVer, historial inmutable en contratos/historial/cm-grafo-v1/) y
      de convivencia de al menos un sprint entre versiones mayores. Congela por primera vez
      cm-impacto-v1 y cm-busqueda-v1; reutiliza sin cambios cm-consulta-v1 y cm-incidentes-v1.
      Doble de prueba: kallicode_core.cm_grafo_doble.ConsultaGrafoDoble (misma semántica que
      PostgreSQL, verificada en el CI). Cliente real:
      kallicode_codemapping.consulta_grafo.ConsultaGrafoPostgres. Fuera de v1: inventario de
      interfaz (previsto como operación nueva compatible en v1.1).
    consumer_approval:
      backend: pending
      testing: pending
      codemapping: approved
    approved_by: []
  - id: KC-CM-09-3-ingesta-stats-uses-table
    status: proposed
    breaking: false
    contrato_version: "1.1.0"
    surfaces:
      - ingesta-stats-v1
    description: >
      ingesta-stats-v1 pasa a 1.1.0 (contratos/ingesta-stats-v1.schema.json): campo opcional
      fase_3.uses_table con las aristas USES_TABLE (archivo -> tabla confirmada por el esquema),
      los accesos a datos detectados y resueltos, la cobertura (resueltos / detectados, null si no
      hay accesos) y el desglose por detector (sql, prisma, typeorm, sqlalchemy, jpa). Cambio
      aditivo: los snapshots anteriores siguen validando. Lo escribe build_graph en el checkpoint
      de la fase 3 (kallicode_codemapping.extract_sql.detectar_uso_tablas).
    consumer_approval:
      backend: pending
      portal: pending
      codemapping: approved
    approved_by: []
