components:
  schemas:
    AlternativaIn:
      properties:
        descripcion:
          default: ''
          title: Descripcion
          type: string
        id:
          title: Id
          type: string
        recomendada:
          default: false
          title: Recomendada
          type: boolean
        riesgo:
          pattern: ^(bajo|medio|alto)$
          title: Riesgo
          type: string
        titulo:
          title: Titulo
          type: string
      required:
      - id
      - titulo
      - riesgo
      title: AlternativaIn
      type: object
    AssignIn:
      properties:
        linea:
          minimum: 1.0
          title: Linea
          type: integer
      required:
      - linea
      title: AssignIn
      type: object
    CriterioResultadoIn:
      additionalProperties: false
      description: Resultado de un criterio individual de la matriz de QA.
      properties:
        criterio_id:
          pattern: ^AC-\d+$
          title: Criterio Id
          type: string
        evidencias:
          items:
            $ref: '#/components/schemas/EvidenciaRefIn'
          title: Evidencias
          type: array
        extracto_fallo:
          anyOf:
          - maxLength: 10000
            minLength: 1
            type: string
          - type: 'null'
          title: Extracto Fallo
        resultado:
          pattern: ^(pasa|falla|flaky)$
          title: Resultado
          type: string
      required:
      - criterio_id
      - resultado
      title: CriterioResultadoIn
      type: object
    CriterioSpecIn:
      properties:
        given:
          title: Given
          type: string
        id:
          pattern: ^AC-\d+$
          title: Id
          type: string
        then:
          title: Then
          type: string
        when:
          title: When
          type: string
      required:
      - id
      - given
      - when
      - then
      title: CriterioSpecIn
      type: object
    DeployResultIn:
      properties:
        anomalia:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Anomalia
        changelog_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Changelog Ref
        destino:
          pattern: ^(staging|produccion)$
          title: Destino
          type: string
        doc_cambio_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Doc Cambio Ref
        mensaje_reporter:
          anyOf:
          - type: string
          - type: 'null'
          title: Mensaje Reporter
        post_deploy:
          additionalProperties: true
          title: Post Deploy
          type: object
        resultado:
          pattern: ^(exito|anomalia|fallo)$
          title: Resultado
          type: string
      required:
      - destino
      - resultado
      - post_deploy
      title: DeployResultIn
      type: object
    DlqReprocesarIn:
      description: Parámetros del reproceso de kc:dlq.
      properties:
        count:
          default: 10
          title: Count
          type: integer
      title: DlqReprocesarIn
      type: object
    ErrorEnvelope:
      properties:
        error:
          properties:
            codigo:
              enum:
              - ADJUNTO_BLOQUEADO
              - ADJUNTO_DEMASIADO_GRANDE
              - ADJUNTO_NO_ENCONTRADO
              - ALMACENAMIENTO_AGOTADO
              - ARTEFACTO_FALTANTE
              - AUTH_MULTIPLE_TENANTS
              - AUTH_PASSWORD_DEBIL
              - AUTH_TOKEN_AJENO
              - AUTH_TOKEN_REVOCADO
              - AUTODESACTIVACION
              - CANCELACION_TARDIA
              - CICLO_INVALIDO
              - CONEXION_DUPLICADA
              - CONFIG_PROVEEDOR
              - CREADOR_OBLIGATORIO
              - CREDENCIALES_INVALIDAS
              - DEPENDENCIA_NO_DISPONIBLE
              - ERROR_INTERNO
              - ETAPA_INCONSISTENTE
              - EVIDENCIA_NO_DISPONIBLE
              - FECHA_PASADA
              - FIRMA_INVALIDA
              - FIRMA_NO_AUTORIZADA
              - FUNCION_NO_DISPONIBLE
              - GATE_NO_ACTIVO
              - GRAFO_NO_DISPONIBLE
              - LIMITE_CREACION
              - LIMITE_USUARIOS_PLAN
              - LIMITE_VISUALIZADORES
              - LINEAS_EXCEDIDAS
              - LINEA_OCUPADA
              - LOC_INCONSISTENTES
              - NO_AUTENTICADO
              - PAYLOAD_EXCESIVO
              - PERMISOS_EXCESIVOS
              - PERMISO_DENEGADO
              - PLAN_NO_SUPERIOR
              - QUOTA_LOC_AGOTADA
              - RATE_LIMIT_EXCEDIDO
              - RECURSO_NO_ENCONTRADO
              - SECURITY_NO_DISPONIBLE
              - SPEC_NO_DISPONIBLE
              - TICKET_REQUERIDO
              - TICKET_YA_EN_PIPELINE
              - TIMEZONE_INVALIDA
              - TIPO_NO_PERMITIDO
              - TRANSICION_INVALIDA
              - USUARIO_NO_ENCONTRADO
              - VALIDACION_ENTRADA
              type: string
            detalle:
              additionalProperties: true
              type: object
            mensaje:
              type: string
            timestamp:
              format: date-time
              type: string
            trace_id:
              type: string
          required:
          - codigo
          - mensaje
          - trace_id
          - timestamp
          type: object
      required:
      - error
      type: object
    EscalationIn:
      properties:
        detalle:
          additionalProperties: true
          title: Detalle
          type: object
        etapa:
          title: Etapa
          type: string
        job_id:
          title: Job Id
          type: string
        motivo:
          pattern: ^(validacion_persistente|baja_confianza|max_iteraciones|selector_repair|anomalia_deploy|otro)$
          title: Motivo
          type: string
        paso:
          anyOf:
          - type: string
          - type: 'null'
          title: Paso
        severidad:
          pattern: ^(baja|media|alta|critica)$
          title: Severidad
          type: string
      required:
      - job_id
      - etapa
      - motivo
      - severidad
      - detalle
      title: EscalationIn
      type: object
    EvidenciaIn:
      properties:
        corrida:
          minimum: 1.0
          title: Corrida
          type: integer
        flaky:
          items: {}
          title: Flaky
          type: array
        matriz:
          items:
            $ref: '#/components/schemas/CriterioResultadoIn'
          minItems: 1
          title: Matriz
          type: array
        regresion:
          additionalProperties: true
          title: Regresion
          type: object
        veredicto_visual:
          items:
            $ref: '#/components/schemas/VeredictoVisualIn'
          title: Veredicto Visual
          type: array
      required:
      - corrida
      - matriz
      - regresion
      title: EvidenciaIn
      type: object
    EvidenciaRefIn:
      additionalProperties: false
      description: Referencia a una evidencia asociada a un resultado de QA.
      properties:
        blob_ref:
          maxLength: 500
          minLength: 1
          title: Blob Ref
          type: string
        tipo:
          maxLength: 80
          minLength: 1
          title: Tipo
          type: string
      required:
      - tipo
      - blob_ref
      title: EvidenciaRefIn
      type: object
    FindingsIn:
      properties:
        hallazgos:
          items:
            $ref: '#/components/schemas/HallazgoIn'
          title: Hallazgos
          type: array
        tickets_proactivos:
          items:
            $ref: '#/components/schemas/TicketProactivoIn'
          title: Tickets Proactivos
          type: array
        veredicto_cambio:
          pattern: ^(approved|blocked)$
          title: Veredicto Cambio
          type: string
      required:
      - hallazgos
      - veredicto_cambio
      title: FindingsIn
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HallazgoIn:
      properties:
        bloquea:
          default: false
          title: Bloquea
          type: boolean
        fix_diff_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Fix Diff Ref
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        justificacion:
          anyOf:
          - type: string
          - type: 'null'
          title: Justificacion
        origen:
          pattern: ^(sast|sca|secrets)$
          title: Origen
          type: string
        severidad_contextual:
          pattern: ^(critica|alta|media|baja)$
          title: Severidad Contextual
          type: string
        titulo:
          title: Titulo
          type: string
        veredicto:
          pattern: ^(confirmado|falso_positivo)$
          title: Veredicto
          type: string
      required:
      - origen
      - severidad_contextual
      - titulo
      - veredicto
      title: HallazgoIn
      type: object
    JobIn:
      properties:
        prioridad_efectiva:
          pattern: ^P[1-4]$
          title: Prioridad Efectiva
          type: string
        ticket_id:
          title: Ticket Id
          type: string
      required:
      - ticket_id
      - prioridad_efectiva
      title: JobIn
      type: object
    LocIn:
      properties:
        anadidas:
          minimum: 0.0
          title: Anadidas
          type: integer
        eliminadas:
          minimum: 0.0
          title: Eliminadas
          type: integer
        netas:
          title: Netas
          type: integer
        pr_url:
          title: Pr Url
          type: string
        tests:
          default: 0
          minimum: 0.0
          title: Tests
          type: integer
        ticket_id:
          title: Ticket Id
          type: string
      required:
      - ticket_id
      - pr_url
      - anadidas
      - eliminadas
      - netas
      title: LocIn
      type: object
    MigracionIn:
      additionalProperties: false
      description: Paso individual de migración asociado a una spec.
      properties:
        archivo:
          maxLength: 255
          minLength: 1
          pattern: ^[0-9]{3}_[a-z0-9_]+\.sql$
          title: Archivo
          type: string
        descripcion:
          maxLength: 2000
          minLength: 1
          title: Descripcion
          type: string
        rollback:
          maxLength: 2000
          minLength: 1
          title: Rollback
          type: string
      required:
      - archivo
      - descripcion
      - rollback
      title: MigracionIn
      type: object
    PlanTestIn:
      additionalProperties: false
      description: Paso individual del plan de pruebas de una spec.
      properties:
        comando:
          maxLength: 1000
          minLength: 1
          title: Comando
          type: string
        criterios:
          items:
            pattern: ^AC-\d+$
            type: string
          minItems: 1
          title: Criterios
          type: array
        nombre:
          maxLength: 240
          minLength: 1
          title: Nombre
          type: string
        tipo:
          pattern: ^(unitario|integracion|contrato|e2e)$
          title: Tipo
          type: string
      required:
      - nombre
      - tipo
      - comando
      - criterios
      title: PlanTestIn
      type: object
    PreflightIn:
      properties:
        destino:
          pattern: ^(staging|produccion)$
          title: Destino
          type: string
      required:
      - destino
      title: PreflightIn
      type: object
    SpecIn:
      properties:
        adr_borrador:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Adr Borrador
        alternativas:
          items:
            $ref: '#/components/schemas/AlternativaIn'
          maxItems: 3
          minItems: 1
          title: Alternativas
          type: array
        criterios:
          items:
            $ref: '#/components/schemas/CriterioSpecIn'
          minItems: 1
          title: Criterios
          type: array
        estimacion_loc:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Estimacion Loc
        migraciones:
          anyOf:
          - items:
              $ref: '#/components/schemas/MigracionIn'
            type: array
          - type: 'null'
          title: Migraciones
        plan_tests:
          anyOf:
          - items:
              $ref: '#/components/schemas/PlanTestIn'
            type: array
          - type: 'null'
          title: Plan Tests
        scope_paths:
          items:
            type: string
          minItems: 1
          title: Scope Paths
          type: array
        spec_md_ref:
          title: Spec Md Ref
          type: string
      required:
      - spec_md_ref
      - alternativas
      - criterios
      - scope_paths
      title: SpecIn
      type: object
    StateIn:
      properties:
        a:
          title: A
          type: string
        contexto:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Contexto
        motivo:
          anyOf:
          - type: string
          - type: 'null'
          title: Motivo
      required:
      - a
      title: StateIn
      type: object
    StepIn:
      properties:
        confianza:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Confianza
        duracion_ms:
          minimum: 0.0
          title: Duracion Ms
          type: integer
        entrada_ref:
          title: Entrada Ref
          type: string
        etapa:
          pattern: ^(triage|design|build|qa|security|deploy)$
          title: Etapa
          type: string
        modelo:
          title: Modelo
          type: string
        paso:
          title: Paso
          type: string
        reintentos:
          default: 0
          minimum: 0.0
          title: Reintentos
          type: integer
        salida_ref:
          title: Salida Ref
          type: string
        tier:
          pattern: ^(flash|pro|fable)$
          title: Tier
          type: string
        tokens_in:
          minimum: 0.0
          title: Tokens In
          type: integer
        tokens_out:
          minimum: 0.0
          title: Tokens Out
          type: integer
        validacion:
          pattern: ^(esquema_valido|reintento|escalado_tier|escalado_humano)$
          title: Validacion
          type: string
        version_plantilla:
          title: Version Plantilla
          type: string
      required:
      - etapa
      - paso
      - version_plantilla
      - modelo
      - tier
      - validacion
      - tokens_in
      - tokens_out
      - duracion_ms
      - entrada_ref
      - salida_ref
      title: StepIn
      type: object
    TicketProactivoIn:
      additionalProperties: false
      description: Datos mínimos para crear un ticket proactivo de seguridad.
      properties:
        cuerpo:
          maxLength: 20000
          minLength: 1
          title: Cuerpo
          type: string
        titulo:
          maxLength: 240
          minLength: 1
          title: Titulo
          type: string
      required:
      - titulo
      - cuerpo
      title: TicketProactivoIn
      type: object
    TriageResultIn:
      properties:
        complejidad:
          pattern: ^(trivial|small|medium|large)$
          title: Complejidad
          type: string
        duplicado_de:
          anyOf:
          - type: string
          - type: 'null'
          title: Duplicado De
        impacto:
          additionalProperties: true
          title: Impacto
          type: object
        prioridad:
          pattern: ^P[1-4]$
          title: Prioridad
          type: string
        relacionados:
          items:
            type: string
          title: Relacionados
          type: array
        tier_recomendado:
          pattern: ^(flash|pro|fable)$
          title: Tier Recomendado
          type: string
        tipo:
          pattern: ^(bug|mejora|funcionalidad|seguridad)$
          title: Tipo
          type: string
      required:
      - tipo
      - prioridad
      - impacto
      - complejidad
      - tier_recomendado
      title: TriageResultIn
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VeredictoVisualIn:
      additionalProperties: false
      description: Resultado de la inspección visual de un criterio de QA.
      properties:
        criterio_id:
          pattern: ^AC-\d+$
          title: Criterio Id
          type: string
        observado:
          maxLength: 10000
          minLength: 1
          title: Observado
          type: string
        region:
          maxLength: 500
          minLength: 1
          title: Region
          type: string
        veredicto:
          pattern: ^(pasa|falla)$
          title: Veredicto
          type: string
      required:
      - criterio_id
      - veredicto
      - observado
      - region
      title: VeredictoVisualIn
      type: object
info:
  description: API interna del pipeline
  title: Kallicode API interna
  version: 1.0.0
openapi: 3.1.0
paths:
  /internal/v1/dlq/reprocesar:
    post:
      description: 'Reinyecta mensajes de kc:dlq a su stream de origen.


        Idempotente por Idempotency-Key: la misma clave devuelve el mismo

        resultado sin re-leer del DLQ. Borra del DLQ solo tras reinyectar.'
      operationId: reprocesar_dlq_internal_v1_dlq_reprocesar_post
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          title: Idempotency-Key
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DlqReprocesarIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Reprocesar Dlq Internal V1 Dlq Reprocesar Post
                type: object
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Solicitud inválida.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: No autenticado.
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Cuota agotada.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Permiso denegado.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Recurso no encontrado.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Conflicto de estado.
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Payload demasiado grande.
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Tipo de contenido no permitido.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation Error
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Límite de peticiones excedido.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error interno.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Dependencia no disponible.
      summary: Reprocesa hasta N mensajes de kc:dlq
      tags:
      - API interna
  /internal/v1/escalations:
    post:
      operationId: escalar_internal_v1_escalations_post
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          title: Idempotency-Key
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalationIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Escalar Internal V1 Escalations Post
                type: object
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Solicitud inválida.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: No autenticado.
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Cuota agotada.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Permiso denegado.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Recurso no encontrado.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Conflicto de estado.
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Payload demasiado grande.
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Tipo de contenido no permitido.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation Error
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Límite de peticiones excedido.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error interno.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Dependencia no disponible.
      summary: Escalar a humano
      tags:
      - API interna
  /internal/v1/jobs:
    get:
      description: Consulta paginada del estado de jobs en el pipeline filtrando por
        ticket o estado.
      operationId: listar_jobs_internal_v1_jobs_get
      parameters:
      - in: query
        name: ticket_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Ticket Id
      - in: query
        name: estado
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Estado
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: page_size
        required: false
        schema:
          default: 25
          maximum: 100
          minimum: 1
          title: Page Size
          type: integer
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Listar Jobs Internal V1 Jobs Get
                type: object
          description: Successful Response
        '400':
          content:
            application/json:
