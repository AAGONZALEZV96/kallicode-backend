components:
  schemas:
    AcceptIn:
      properties:
        idioma:
          anyOf:
          - pattern: ^(es|en|pt)$
            type: string
          - type: 'null'
          title: Idioma
        nombre:
          maxLength: 120
          minLength: 2
          title: Nombre
          type: string
        password:
          maxLength: 128
          minLength: 12
          title: Password
          type: string
        token:
          pattern: ^kcin_
          title: Token
          type: string
      required:
      - token
      - nombre
      - password
      title: AcceptIn
      type: object
    AdjuntoIn:
      properties:
        content_type:
          title: Content Type
          type: string
        nombre_archivo:
          maxLength: 255
          minLength: 1
          title: Nombre Archivo
          type: string
        tamano_bytes:
          minimum: 1.0
          title: Tamano Bytes
          type: integer
      required:
      - nombre_archivo
      - content_type
      - tamano_bytes
      title: AdjuntoIn
      type: object
    AlternativaIn:
      properties:
        descripcion:
          default: ''
          title: Descripcion
          type: string
        id:
          title: Id
          type: string
        recomendada:
          default: false
          title: Recomendada
          type: boolean
        riesgo:
          pattern: ^(bajo|medio|alto)$
          title: Riesgo
          type: string
        titulo:
          title: Titulo
          type: string
      required:
      - id
      - titulo
      - riesgo
      title: AlternativaIn
      type: object
    AssignIn:
      properties:
        linea:
          minimum: 1.0
          title: Linea
          type: integer
      required:
      - linea
      title: AssignIn
      type: object
    BranchMapIn:
      properties:
        feature:
          maxLength: 100
          title: Feature
          type: string
        produccion:
          maxLength: 100
          title: Produccion
          type: string
        staging:
          maxLength: 100
          title: Staging
          type: string
      required:
      - feature
      - staging
      - produccion
      title: BranchMapIn
      type: object
    CambiosIn:
      description: 'Entrada de devolución: el comentario re-entra como contexto del
        agente.'
      properties:
        comentario:
          maxLength: 2000
          minLength: 10
          title: Comentario
          type: string
        devolver_a:
          anyOf:
          - pattern: ^(design|build|qa)$
            type: string
          - type: 'null'
          title: Devolver A
      required:
      - comentario
      title: CambiosIn
      type: object
    ConexionIn:
      properties:
        categoria:
          pattern: ^(repositorio|tickets|cicd|database)$
          title: Categoria
          type: string
        config:
          additionalProperties: true
          title: Config
          type: object
        credenciales:
          additionalProperties: true
          title: Credenciales
          type: object
        nombre:
          anyOf:
          - maxLength: 120
            type: string
          - type: 'null'
          title: Nombre
        proveedor:
          title: Proveedor
          type: string
      required:
      - categoria
      - proveedor
      - credenciales
      title: ConexionIn
      type: object
    ConexionPatch:
      properties:
        config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Config
        credenciales:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Credenciales
        nombre:
          anyOf:
          - type: string
          - type: 'null'
          title: Nombre
      title: ConexionPatch
      type: object
    CriterioIn:
      properties:
        given:
          maxLength: 500
          minLength: 5
          title: Given
          type: string
        then:
          maxLength: 500
          minLength: 5
          title: Then
          type: string
        when:
          maxLength: 500
          minLength: 5
          title: When
          type: string
      required:
      - given
      - when
      - then
      title: CriterioIn
      type: object
    CriterioResultadoIn:
      additionalProperties: false
      description: Resultado de un criterio individual de la matriz de QA.
      properties:
        criterio_id:
          pattern: ^AC-\d+$
          title: Criterio Id
          type: string
        evidencias:
          items:
            $ref: '#/components/schemas/EvidenciaRefIn'
          title: Evidencias
          type: array
        extracto_fallo:
          anyOf:
          - maxLength: 10000
            minLength: 1
            type: string
          - type: 'null'
          title: Extracto Fallo
        resultado:
          pattern: ^(pasa|falla|flaky)$
          title: Resultado
          type: string
      required:
      - criterio_id
      - resultado
      title: CriterioResultadoIn
      type: object
    CriterioSpecIn:
      properties:
        given:
          title: Given
          type: string
        id:
          pattern: ^AC-\d+$
          title: Id
          type: string
        then:
          title: Then
          type: string
        when:
          title: When
          type: string
      required:
      - id
      - given
      - when
      - then
      title: CriterioSpecIn
      type: object
    DeployResultIn:
      properties:
        anomalia:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Anomalia
        changelog_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Changelog Ref
        destino:
          pattern: ^(staging|produccion)$
          title: Destino
          type: string
        doc_cambio_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Doc Cambio Ref
        mensaje_reporter:
          anyOf:
          - type: string
          - type: 'null'
          title: Mensaje Reporter
        post_deploy:
          additionalProperties: true
          title: Post Deploy
          type: object
        resultado:
          pattern: ^(exito|anomalia|fallo)$
          title: Resultado
          type: string
      required:
      - destino
      - resultado
      - post_deploy
      title: DeployResultIn
      type: object
    DocIn:
      properties:
        content_type:
          title: Content Type
          type: string
        nombre_archivo:
          maxLength: 255
          minLength: 1
          title: Nombre Archivo
          type: string
        tamano_bytes:
          maximum: 52428800.0
          minimum: 1.0
          title: Tamano Bytes
          type: integer
        tipo_documento:
          default: otro
          pattern: ^(manual|spec|adr|negocio|otro)$
          title: Tipo Documento
          type: string
      required:
      - nombre_archivo
      - content_type
      - tamano_bytes
      title: DocIn
      type: object
    ErrorEnvelope:
      properties:
        error:
          properties:
            codigo:
              enum:
              - ADJUNTO_DEMASIADO_GRANDE
              - ARTEFACTO_FALTANTE
              - AUTH_MULTIPLE_TENANTS
              - AUTH_PASSWORD_DEBIL
              - AUTH_TOKEN_AJENO
              - AUTH_TOKEN_REVOCADO
              - AUTODESACTIVACION
              - CICLO_INVALIDO
              - CONEXION_DUPLICADA
              - CONFIG_PROVEEDOR
              - CREDENCIALES_INVALIDAS
              - DEPENDENCIA_NO_DISPONIBLE
              - ERROR_INTERNO
              - ETAPA_INCONSISTENTE
              - FECHA_PASADA
              - FIRMA_INVALIDA
              - FIRMA_NO_AUTORIZADA
              - FUNCION_NO_DISPONIBLE
              - GATE_NO_ACTIVO
              - LIMITE_VISUALIZADORES
              - LINEAS_EXCEDIDAS
              - LINEA_OCUPADA
              - LOC_INCONSISTENTES
              - NO_AUTENTICADO
              - PAYLOAD_EXCESIVO
              - PERMISOS_EXCESIVOS
              - PERMISO_DENEGADO
              - PLAN_NO_SUPERIOR
              - QUOTA_LOC_AGOTADA
              - RATE_LIMIT_EXCEDIDO
              - RECURSO_NO_ENCONTRADO
              - TICKET_REQUERIDO
              - TIMEZONE_INVALIDA
              - TIPO_NO_PERMITIDO
              - TRANSICION_INVALIDA
              - USUARIO_NO_ENCONTRADO
              - VALIDACION_ENTRADA
              type: string
            detalle:
              additionalProperties: true
              type: object
            mensaje:
              type: string
            timestamp:
              format: date-time
              type: string
            trace_id:
              type: string
          required:
          - codigo
          - mensaje
          - trace_id
          - timestamp
          type: object
      required:
      - error
      type: object
    EscalationIn:
      properties:
        detalle:
          additionalProperties: true
          title: Detalle
          type: object
        etapa:
          title: Etapa
          type: string
        job_id:
          title: Job Id
          type: string
        motivo:
          pattern: ^(validacion_persistente|baja_confianza|max_iteraciones|selector_repair|anomalia_deploy|otro)$
          title: Motivo
          type: string
        paso:
          anyOf:
          - type: string
          - type: 'null'
          title: Paso
        severidad:
          pattern: ^(baja|media|alta|critica)$
          title: Severidad
          type: string
      required:
      - job_id
      - etapa
      - motivo
      - severidad
      - detalle
      title: EscalationIn
      type: object
    EvidenciaIn:
      properties:
        corrida:
          minimum: 1.0
          title: Corrida
          type: integer
        flaky:
          items: {}
          title: Flaky
          type: array
        matriz:
          items:
            $ref: '#/components/schemas/CriterioResultadoIn'
          minItems: 1
          title: Matriz
          type: array
        regresion:
          additionalProperties: true
          title: Regresion
          type: object
        veredicto_visual:
          items:
            $ref: '#/components/schemas/VeredictoVisualIn'
          title: Veredicto Visual
          type: array
      required:
      - corrida
      - matriz
      - regresion
      title: EvidenciaIn
      type: object
    EvidenciaRefIn:
      additionalProperties: false
      description: Referencia a una evidencia asociada a un resultado de QA.
      properties:
        blob_ref:
          maxLength: 500
          minLength: 1
          title: Blob Ref
          type: string
        tipo:
          maxLength: 80
          minLength: 1
          title: Tipo
          type: string
      required:
      - tipo
      - blob_ref
      title: EvidenciaRefIn
      type: object
    ExportIn:
      properties:
        filtros:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Filtros
        formato:
          pattern: ^(csv|pdf)$
          title: Formato
          type: string
        ticket_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Ticket Id
      required:
      - formato
      title: ExportIn
      type: object
    FeatureIn:
      description: 'Creación de funcionalidad (§9.3): objetivo + criterios GWT.'
      properties:
        adjuntos:
          items:
            type: string
          maxItems: 10
          title: Adjuntos
          type: array
        criterios:
          items:
            $ref: '#/components/schemas/CriterioIn'
          maxItems: 30
          title: Criterios
          type: array
        fecha_objetivo:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Fecha Objetivo
        modulos_estimados:
          items:
            type: string
          maxItems: 20
          title: Modulos Estimados
          type: array
        nombre:
          maxLength: 200
          minLength: 5
          title: Nombre
          type: string
        objetivo:
          maxLength: 10000
          minLength: 20
          title: Objetivo
          type: string
      required:
      - nombre
      - objetivo
      title: FeatureIn
      type: object
    FindingsIn:
      properties:
        hallazgos:
          items:
            $ref: '#/components/schemas/HallazgoIn'
          title: Hallazgos
          type: array
        tickets_proactivos:
          items:
            $ref: '#/components/schemas/TicketProactivoIn'
          title: Tickets Proactivos
          type: array
        veredicto_cambio:
          pattern: ^(approved|blocked)$
          title: Veredicto Cambio
          type: string
      required:
      - hallazgos
      - veredicto_cambio
      title: FindingsIn
      type: object
    FirmaIn:
      description: Entrada de aprobación de gate.
      properties:
        acepta_fallos:
          default: false
          title: Acepta Fallos
          type: boolean
        alternativa_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Alternativa Id
        comentario:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Comentario
      title: FirmaIn
      type: object
    ForgotIn:
      properties:
        email:
          format: email
          title: Email
          type: string
        org_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Org Id
      required:
      - email
      title: ForgotIn
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HallazgoIn:
      properties:
        bloquea:
          default: false
          title: Bloquea
          type: boolean
        fix_diff_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Fix Diff Ref
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        justificacion:
          anyOf:
          - type: string
          - type: 'null'
          title: Justificacion
        origen:
          pattern: ^(sast|sca|secrets)$
          title: Origen
          type: string
        severidad_contextual:
          pattern: ^(critica|alta|media|baja)$
          title: Severidad Contextual
          type: string
        titulo:
          title: Titulo
          type: string
        veredicto:
          pattern: ^(confirmado|falso_positivo)$
          title: Veredicto
          type: string
      required:
      - origen
      - severidad_contextual
      - titulo
      - veredicto
      title: HallazgoIn
      type: object
    InviteIn:
      properties:
        email:
          format: email
          title: Email
          type: string
        mensaje:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Mensaje
        rol:
          pattern: ^(owner|admin|architect|approver|member|viewer)$
          title: Rol
          type: string
      required:
      - email
      - rol
      title: InviteIn
      type: object
    JobIn:
      properties:
        prioridad_efectiva:
          pattern: ^P[1-4]$
          title: Prioridad Efectiva
          type: string
        ticket_id:
          title: Ticket Id
          type: string
      required:
      - ticket_id
      - prioridad_efectiva
      title: JobIn
      type: object
    LeidaIn:
      properties:
        leida:
          title: Leida
          type: boolean
      required:
      - leida
      title: LeidaIn
      type: object
    LocIn:
      properties:
        anadidas:
          minimum: 0.0
          title: Anadidas
          type: integer
        eliminadas:
          minimum: 0.0
          title: Eliminadas
          type: integer
        netas:
          title: Netas
          type: integer
        pr_url:
          title: Pr Url
          type: string
        tests:
          default: 0
          minimum: 0.0
          title: Tests
          type: integer
        ticket_id:
          title: Ticket Id
          type: string
      required:
      - ticket_id
      - pr_url
      - anadidas
      - eliminadas
      - netas
      title: LocIn
      type: object
    LoginIn:
      description: Entrada de login. email se normaliza a minúsculas.
      properties:
        email:
          format: email
          title: Email
          type: string
        org_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Org Id
        password:
          maxLength: 128
          minLength: 8
          title: Password
          type: string
      required:
      - email
      - password
      title: LoginIn
      type: object
    LogoutIn:
      properties:
        refresh_token:
          title: Refresh Token
          type: string
        todas:
          default: false
          title: Todas
          type: boolean
      required:
      - refresh_token
      title: LogoutIn
      type: object
    MePatch:
      properties:
        idioma:
          anyOf:
          - pattern: ^(es|en|pt)$
            type: string
          - type: 'null'
          title: Idioma
        nombre:
          anyOf:
          - maxLength: 120
            minLength: 2
            type: string
          - type: 'null'
          title: Nombre
        notificaciones:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Notificaciones
        password_actual:
          anyOf:
          - type: string
          - type: 'null'
          title: Password Actual
        password_nueva:
          anyOf:
          - type: string
          - type: 'null'
          title: Password Nueva
      title: MePatch
      type: object
    MigracionIn:
      additionalProperties: false
      description: Paso individual de migración asociado a una spec.
      properties:
        archivo:
          maxLength: 255
          minLength: 1
          pattern: ^[0-9]{3}_[a-z0-9_]+\.sql$
          title: Archivo
          type: string
        descripcion:
          maxLength: 2000
          minLength: 1
          title: Descripcion
          type: string
        rollback:
          maxLength: 2000
          minLength: 1
          title: Rollback
          type: string
      required:
      - archivo
      - descripcion
      - rollback
      title: MigracionIn
      type: object
    OrgPatch:
      description: Campos actualizables del tenant (parcial).
      properties:
        idioma:
          anyOf:
          - pattern: ^(es|en|pt)$
            type: string
          - type: 'null'
          title: Idioma
        nombre:
          anyOf:
          - maxLength: 160
            minLength: 2
            type: string
          - type: 'null'
          title: Nombre
        timezone:
          anyOf:
          - type: string
          - type: 'null'
          title: Timezone
      title: OrgPatch
      type: object
    PlanTestIn:
      additionalProperties: false
      description: Paso individual del plan de pruebas de una spec.
      properties:
        comando:
          maxLength: 1000
          minLength: 1
          title: Comando
          type: string
        criterios:
          items:
            pattern: ^AC-\d+$
            type: string
          minItems: 1
          title: Criterios
          type: array
        nombre:
          maxLength: 240
          minLength: 1
          title: Nombre
          type: string
        tipo:
          pattern: ^(unitario|integracion|contrato|e2e)$
          title: Tipo
          type: string
      required:
      - nombre
      - tipo
      - comando
      - criterios
      title: PlanTestIn
      type: object
    PreflightIn:
      properties:
        destino:
          pattern: ^(staging|produccion)$
          title: Destino
          type: string
      required:
      - destino
      title: PreflightIn
      type: object
    PreviewIn:
      properties:
        k:
          default: 3
          maximum: 10.0
          minimum: 1.0
          title: K
          type: integer
        texto:
          maxLength: 2000
          title: Texto
          type: string
      required:
      - texto
      title: PreviewIn
      type: object
    RefreshIn:
      properties:
        refresh_token:
          pattern: ^kcrt_
          title: Refresh Token
          type: string
      required:
      - refresh_token
      title: RefreshIn
      type: object
    ResetIn:
      properties:
        password_nueva:
          maxLength: 128
          minLength: 12
          title: Password Nueva
          type: string
        token:
          pattern: ^kcpr_
          title: Token
          type: string
      required:
      - token
      - password_nueva
      title: ResetIn
      type: object
    SpecIn:
      properties:
        adr_borrador:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Adr Borrador
        alternativas:
          items:
            $ref: '#/components/schemas/AlternativaIn'
          maxItems: 3
          minItems: 1
          title: Alternativas
          type: array
        criterios:
          items:
            $ref: '#/components/schemas/CriterioSpecIn'
          minItems: 1
          title: Criterios
          type: array
        estimacion_loc:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Estimacion Loc
        migraciones:
          anyOf:
          - items:
              $ref: '#/components/schemas/MigracionIn'
            type: array
          - type: 'null'
          title: Migraciones
        plan_tests:
          anyOf:
          - items:
              $ref: '#/components/schemas/PlanTestIn'
            type: array
          - type: 'null'
          title: Plan Tests
        scope_paths:
          items:
            type: string
          minItems: 1
          title: Scope Paths
          type: array
        spec_md_ref:
          title: Spec Md Ref
          type: string
      required:
      - spec_md_ref
      - alternativas
      - criterios
      - scope_paths
      title: SpecIn
      type: object
    StateIn:
      properties:
        a:
          title: A
          type: string
        contexto:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Contexto
        motivo:
          anyOf:
          - type: string
          - type: 'null'
          title: Motivo
      required:
      - a
      title: StateIn
      type: object
    StepIn:
      properties:
        confianza:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Confianza
        duracion_ms:
          minimum: 0.0
          title: Duracion Ms
          type: integer
        entrada_ref:
          title: Entrada Ref
          type: string
        etapa:
          pattern: ^(triage|design|build|qa|security|deploy)$
          title: Etapa
          type: string
        modelo:
          title: Modelo
          type: string
        paso:
          title: Paso
          type: string
        reintentos:
          default: 0
          minimum: 0.0
          title: Reintentos
          type: integer
        salida_ref:
          title: Salida Ref
          type: string
        tier:
          pattern: ^(flash|pro|fable)$
          title: Tier
          type: string
        tokens_in:
          minimum: 0.0
          title: Tokens In
          type: integer
        tokens_out:
          minimum: 0.0
          title: Tokens Out
          type: integer
        validacion:
          pattern: ^(esquema_valido|reintento|escalado_tier|escalado_humano)$
          title: Validacion
          type: string
        version_plantilla:
          title: Version Plantilla
          type: string
      required:
      - etapa
      - paso
      - version_plantilla
      - modelo
      - tier
      - validacion
      - tokens_in
      - tokens_out
      - duracion_ms
      - entrada_ref
      - salida_ref
      title: StepIn
      type: object
    TicketIn:
      description: Creación de bug/mejora (§9.2).
      properties:
        adjuntos:
          items:
            type: string
          maxItems: 10
          title: Adjuntos
          type: array
        descripcion:
          maxLength: 10000
          minLength: 10
          title: Descripcion
          type: string
        modulo:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Modulo
        prioridad:
          default: media
          pattern: ^(alta|media|baja)$
          title: Prioridad
          type: string
        tipo:
          pattern: ^(bug|mejora)$
          title: Tipo
          type: string
        titulo:
          maxLength: 200
          minLength: 5
          title: Titulo
          type: string
      required:
      - tipo
      - titulo
      - descripcion
      title: TicketIn
      type: object
    TicketPatch:
      properties:
        accion:
          anyOf:
          - pattern: ^cancelar$
            type: string
          - type: 'null'
          title: Accion
