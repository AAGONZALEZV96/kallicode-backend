components:
  schemas:
    AlternativaIn:
      properties:
        descripcion:
          default: ''
          title: Descripcion
          type: string
        id:
          title: Id
          type: string
        recomendada:
          default: false
          title: Recomendada
          type: boolean
        riesgo:
          pattern: ^(bajo|medio|alto)$
          title: Riesgo
          type: string
        titulo:
          title: Titulo
          type: string
      required:
      - id
      - titulo
      - riesgo
      title: AlternativaIn
      type: object
    Arista:
      additionalProperties: false
      properties:
        dst_id:
          title: Dst Id
          type: string
        dst_kind:
          title: Dst Kind
          type: string
        src_id:
          title: Src Id
          type: string
        src_kind:
          title: Src Kind
          type: string
        tipo:
          $ref: '#/components/schemas/TipoArista'
      required:
      - tipo
      - src_kind
      - src_id
      - dst_kind
      - dst_id
      title: Arista
      type: object
    AssignIn:
      properties:
        linea:
          minimum: 1.0
          title: Linea
          type: integer
      required:
      - linea
      title: AssignIn
      type: object
    BusquedaHibridaIn:
      additionalProperties: false
      description: Qué se busca y dónde. El tenant es el de la sesión.
      properties:
        capas:
          anyOf:
          - items:
              $ref: '#/components/schemas/CapaBusqueda'
            minItems: 1
            type: array
          - type: 'null'
          description: Capas en las que buscar; None = todas.
          title: Capas
        embedding:
          description: Embedding BGE-M3 de la consulta (1024 dimensiones).
          items:
            type: number
          maxItems: 1024
          minItems: 1024
          title: Embedding
          type: array
        incluir_sin_curar:
          default: false
          description: Incluye conceptos y nuggets aún sin curar (petición explícita).
          title: Incluir Sin Curar
          type: boolean
        k:
          default: 10
          maximum: 100.0
          minimum: 1.0
          title: K
          type: integer
        modulo:
          anyOf:
          - maxLength: 500
            minLength: 1
            type: string
          - type: 'null'
          description: Prefijo de ruta con semántica de carpeta ('src/billing' no
            casa 'src/billingx').
          title: Modulo
      required:
      - embedding
      title: BusquedaHibridaIn
      type: object
    BusquedaHibridaOut:
      additionalProperties: false
      properties:
        incluye_sin_curar:
          title: Incluye Sin Curar
          type: boolean
        resultados:
          items:
            $ref: '#/components/schemas/ResultadoBusqueda'
          title: Resultados
          type: array
        version:
          const: cm-busqueda-v1
          default: cm-busqueda-v1
          title: Version
          type: string
      required:
      - resultados
      - incluye_sin_curar
      title: BusquedaHibridaOut
      type: object
    CapaBusqueda:
      description: 'Capas de cm.capas_busqueda(): kinds de vec.definition_embeddings,
        doc y nugget.'
      enum:
      - file
      - symbol
      - db_table
      - db_column
      - definition
      - concept
      - doc
      - nugget
      title: CapaBusqueda
      type: string
    ConsultaGrafoIn:
      additionalProperties: false
      description: Área de partida y alcance del recorrido. El tenant es el de la
        sesión.
      properties:
        ficheros:
          description: Rutas (cm.files.path); cada una aporta el fichero y sus símbolos.
          items:
            type: string
          maxItems: 500
          title: Ficheros
          type: array
        k:
          default: 3
          description: Saltos máximos.
          maximum: 5.0
          minimum: 1.0
          title: K
          type: integer
        nodos:
          description: Ids de nodos del grafo (cm.nodes) desde los que se recorre.
          items:
            type: string
          maxItems: 500
          title: Nodos
          type: array
        tipos:
          anyOf:
          - items:
              $ref: '#/components/schemas/TipoArista'
            minItems: 1
            type: array
          - type: 'null'
          description: Tipos de arista recorridos; por defecto los de dependencia
            (impacto y dependencias) o todos (subgrafo).
          title: Tipos
      title: ConsultaGrafoIn
      type: object
    ConsultaIncidentesIn:
      additionalProperties: false
      description: Área que se va a tocar y, opcionalmente, el embedding del ticket
        para ordenar.
      properties:
        embedding:
          anyOf:
          - items:
              type: number
            maxItems: 1024
            minItems: 1024
            type: array
          - type: 'null'
          description: Embedding BGE-M3 del ticket; sin él no se ordena por similitud.
          title: Embedding
        ficheros:
          description: Rutas (cm.files.path); incluyen sus símbolos.
          items:
            type: string
          maxItems: 500
          title: Ficheros
          type: array
        nodos:
          description: Ids de nodos del grafo (cm.nodes) del área.
          items:
            type: string
          maxItems: 500
          title: Nodos
          type: array
        presupuesto_caracteres:
          default: 4000
          maximum: 20000.0
          minimum: 0.0
          title: Presupuesto Caracteres
          type: integer
        saltos:
          default: 2
          maximum: 2.0
          minimum: 0.0
          title: Saltos
          type: integer
      title: ConsultaIncidentesIn
      type: object
    ConsultaIncidentesOut:
      additionalProperties: false
      description: Bloque listo para la plantilla y los incidentes que lo forman,
        en orden de entrega.
      properties:
        caracteres_usados:
          minimum: 0.0
          title: Caracteres Usados
          type: integer
        incidentes:
          items:
            $ref: '#/components/schemas/IncidenteAplicable'
          title: Incidentes
          type: array
        omitidos:
          description: Candidatos que no cupieron en el presupuesto.
          minimum: 0.0
          title: Omitidos
          type: integer
        presupuesto_caracteres:
          minimum: 0.0
          title: Presupuesto Caracteres
          type: integer
        texto:
          description: Una línea "- ..." por incidente; "" si no hay.
          title: Texto
          type: string
        version:
          const: cm-incidentes-v1
          default: cm-incidentes-v1
          title: Version
          type: string
      required:
      - texto
      - incidentes
      - omitidos
      - presupuesto_caracteres
      - caracteres_usados
      title: ConsultaIncidentesOut
      type: object
    ConsultaNuggetsIn:
      additionalProperties: false
      description: Qué variable se resuelve y para qué área del grafo. El tenant es
        el de la sesión.
      properties:
        ficheros:
          description: Rutas de fichero (cm.files.path); incluyen sus símbolos.
          items:
            type: string
          maxItems: 500
          title: Ficheros
          type: array
        modulo:
          anyOf:
          - maxLength: 500
            minLength: 1
            type: string
          - type: 'null'
          description: Prefijo de ruta del módulo (obligatorio en module_conventions).
          title: Modulo
        nodos:
          description: Ids de nodos del grafo (cm.nodes) del área que se va a tocar.
          items:
            type: string
          maxItems: 500
          title: Nodos
          type: array
        presupuesto_caracteres:
          default: 5660
          maximum: 20000.0
          minimum: 0.0
          title: Presupuesto Caracteres
          type: integer
        variable:
          $ref: '#/components/schemas/VariablePlantilla'
      required:
      - variable
      title: ConsultaNuggetsIn
      type: object
    ConsultaNuggetsOut:
      additionalProperties: false
      description: Bloque listo para la plantilla y las reglas que lo forman, en orden
        de entrega.
      properties:
        caracteres_usados:
          minimum: 0.0
          title: Caracteres Usados
          type: integer
        nuggets:
          description: Los nuggets incluidos en `texto`.
          items:
            $ref: '#/components/schemas/NuggetAplicable'
          title: Nuggets
          type: array
        omitidos:
          description: Candidatos que no cupieron en el presupuesto.
          minimum: 0.0
          title: Omitidos
          type: integer
        presupuesto_caracteres:
          minimum: 0.0
          title: Presupuesto Caracteres
          type: integer
        texto:
          description: Una línea "- <regla>" por nugget; "" si no hay reglas.
          title: Texto
          type: string
        variable:
          $ref: '#/components/schemas/VariablePlantilla'
        version:
          const: cm-consulta-v1
          default: cm-consulta-v1
          title: Version
          type: string
      required:
      - variable
      - texto
      - nuggets
      - omitidos
      - presupuesto_caracteres
      - caracteres_usados
      title: ConsultaNuggetsOut
      type: object
    CriterioResultadoIn:
      additionalProperties: false
      description: Resultado de un criterio individual de la matriz de QA.
      properties:
        criterio_id:
          pattern: ^AC-\d+$
          title: Criterio Id
          type: string
        evidencias:
          items:
            $ref: '#/components/schemas/EvidenciaRefIn'
          title: Evidencias
          type: array
        extracto_fallo:
          anyOf:
          - maxLength: 10000
            minLength: 1
            type: string
          - type: 'null'
          title: Extracto Fallo
        resultado:
          pattern: ^(pasa|falla|flaky)$
          title: Resultado
          type: string
      required:
      - criterio_id
      - resultado
      title: CriterioResultadoIn
      type: object
    CriterioSpecIn:
      properties:
        given:
          title: Given
          type: string
        id:
          pattern: ^AC-\d+$
          title: Id
          type: string
        then:
          title: Then
          type: string
        when:
          title: When
          type: string
      required:
      - id
      - given
      - when
      - then
      title: CriterioSpecIn
      type: object
    DependenciaOculta:
      additionalProperties: false
      properties:
        distancia:
          description: Saltos CALLS hasta el símbolo del área que usa la tabla.
          maximum: 5.0
          minimum: 0.0
          title: Distancia
          type: integer
        id:
          title: Id
          type: string
        kind:
          title: Kind
          type: string
        tablas:
          description: Tablas compartidas con el área.
          items:
            type: string
          minItems: 1
          title: Tablas
          type: array
      required:
      - id
      - kind
      - tablas
      - distancia
      title: DependenciaOculta
      type: object
    DependenciasOcultasOut:
      additionalProperties: false
      properties:
        dependencias:
          items:
            $ref: '#/components/schemas/DependenciaOculta'
          title: Dependencias
          type: array
        k:
          title: K
          type: integer
        semillas:
          items:
            type: string
          title: Semillas
          type: array
        truncado:
          title: Truncado
          type: boolean
        version:
          const: cm-impacto-v1
          default: cm-impacto-v1
          title: Version
          type: string
      required:
      - k
      - semillas
      - dependencias
      - truncado
      title: DependenciasOcultasOut
      type: object
    DeployResultIn:
      properties:
        anomalia:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Anomalia
        changelog_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Changelog Ref
        destino:
          pattern: ^(staging|produccion)$
          title: Destino
          type: string
        doc_cambio_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Doc Cambio Ref
        mensaje_reporter:
          anyOf:
          - type: string
          - type: 'null'
          title: Mensaje Reporter
        post_deploy:
          additionalProperties: true
          title: Post Deploy
          type: object
        resultado:
          pattern: ^(exito|anomalia|fallo)$
          title: Resultado
          type: string
      required:
      - destino
      - resultado
      - post_deploy
      title: DeployResultIn
      type: object
    DlqReprocesarIn:
      description: Parámetros del reproceso de kc:dlq.
      properties:
        count:
          default: 10
          title: Count
          type: integer
      title: DlqReprocesarIn
      type: object
    ErrorEnvelope:
      properties:
        error:
          properties:
            codigo:
              enum:
              - ADJUNTO_BLOQUEADO
              - ADJUNTO_DEMASIADO_GRANDE
              - ADJUNTO_NO_ENCONTRADO
              - ALMACENAMIENTO_AGOTADO
              - ALTERNATIVA_REQUERIDA
              - ANOMALIA_SIN_ANALISIS
              - ARTEFACTO_FALTANTE
              - AUTH_MULTIPLE_TENANTS
              - AUTH_PASSWORD_DEBIL
              - AUTH_TOKEN_AJENO
              - AUTH_TOKEN_REVOCADO
              - AUTODESACTIVACION
              - CANCELACION_TARDIA
              - CICLO_INVALIDO
              - CONEXION_DUPLICADA
              - CONEXION_EN_USO
              - CONFIG_PROVEEDOR
              - CREADOR_OBLIGATORIO
              - CREDENCIALES_INVALIDAS
              - DEPENDENCIA_NO_DISPONIBLE
              - ERROR_INTERNO
              - ETAPA_INCONSISTENTE
              - EVIDENCIA_NO_DISPONIBLE
              - FALLOS_SIN_ACEPTAR
              - FECHA_PASADA
              - FIRMA_INVALIDA
              - FIRMA_NO_AUTORIZADA
              - FUNCION_NO_DISPONIBLE
              - GATE_NO_ACTIVO
              - GATE_REQUERIDO
              - GRAFO_NO_DISPONIBLE
              - JOBS_ACTIVOS
              - LIMITE_CREACION
              - LIMITE_USUARIOS_PLAN
              - LIMITE_VISUALIZADORES
              - LINEAS_EXCEDIDAS
              - LINEA_OCUPADA
              - LOC_INCONSISTENTES
              - MATRIZ_INCOMPLETA
              - MAX_ITERACIONES
              - NO_AUTENTICADO
              - ONBOARDING_INCOMPLETO
              - PAYLOAD_EXCESIVO
              - PERMISOS_EXCESIVOS
              - PERMISO_DENEGADO
              - PLAN_NO_SUPERIOR
              - PRECONDICION_GATE
              - QUOTA_LOC_AGOTADA
              - RANGO_EXCESIVO
              - RATE_LIMIT_EXCEDIDO
              - RECURSO_NO_ENCONTRADO
              - SCOPE_PROHIBIDO
              - SECURITY_NO_DISPONIBLE
              - SPEC_NO_DISPONIBLE
              - TICKET_REQUERIDO
              - TICKET_YA_EN_PIPELINE
              - TIMEZONE_INVALIDA
              - TIPO_NO_PERMITIDO
              - TRANSICION_INVALIDA
              - USUARIO_NO_ENCONTRADO
              - VALIDACION_ENTRADA
              - VEREDICTO_INCONSISTENTE
              type: string
            detalle:
              additionalProperties: true
              type: object
            mensaje:
              type: string
            timestamp:
              format: date-time
              type: string
            trace_id:
              type: string
          required:
          - codigo
          - mensaje
          - trace_id
          - timestamp
          type: object
      required:
      - error
      type: object
    EscalationIn:
      properties:
        detalle:
          additionalProperties: true
          title: Detalle
          type: object
        etapa:
          title: Etapa
          type: string
        job_id:
          title: Job Id
          type: string
        motivo:
          pattern: ^(validacion_persistente|baja_confianza|max_iteraciones|selector_repair|anomalia_deploy|otro)$
          title: Motivo
          type: string
        paso:
          anyOf:
          - type: string
          - type: 'null'
          title: Paso
        severidad:
          pattern: ^(baja|media|alta|critica)$
          title: Severidad
          type: string
      required:
      - job_id
      - etapa
      - motivo
      - severidad
      - detalle
      title: EscalationIn
      type: object
    EvidenciaIn:
      properties:
        corrida:
          minimum: 1.0
          title: Corrida
          type: integer
        flaky:
          items: {}
          title: Flaky
          type: array
        matriz:
          items:
            $ref: '#/components/schemas/CriterioResultadoIn'
          minItems: 1
          title: Matriz
          type: array
        regresion:
          additionalProperties: true
          title: Regresion
          type: object
        veredicto_visual:
          items:
            $ref: '#/components/schemas/VeredictoVisualIn'
          title: Veredicto Visual
          type: array
      required:
      - corrida
      - matriz
      - regresion
      title: EvidenciaIn
      type: object
    EvidenciaRefIn:
      additionalProperties: false
      description: Referencia a una evidencia asociada a un resultado de QA.
      properties:
        blob_ref:
          maxLength: 500
          minLength: 1
          title: Blob Ref
          type: string
        tipo:
          maxLength: 80
          minLength: 1
          title: Tipo
          type: string
      required:
      - tipo
      - blob_ref
      title: EvidenciaRefIn
      type: object
    FindingsIn:
      properties:
        hallazgos:
          items:
            $ref: '#/components/schemas/HallazgoIn'
          title: Hallazgos
          type: array
        tickets_proactivos:
          items:
            $ref: '#/components/schemas/TicketProactivoIn'
          title: Tickets Proactivos
          type: array
        veredicto_cambio:
          pattern: ^(approved|blocked)$
          title: Veredicto Cambio
          type: string
      required:
      - hallazgos
      - veredicto_cambio
      title: FindingsIn
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HallazgoIn:
      properties:
        bloquea:
          default: false
          title: Bloquea
          type: boolean
        fix_diff_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Fix Diff Ref
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        justificacion:
          anyOf:
          - type: string
          - type: 'null'
          title: Justificacion
        origen:
          pattern: ^(sast|sca|secrets)$
          title: Origen
          type: string
        severidad_contextual:
          pattern: ^(critica|alta|media|baja)$
          title: Severidad Contextual
          type: string
        titulo:
          title: Titulo
          type: string
        veredicto:
          pattern: ^(confirmado|falso_positivo)$
          title: Veredicto
          type: string
      required:
      - origen
      - severidad_contextual
      - titulo
      - veredicto
      title: HallazgoIn
      type: object
    IncidenteAplicable:
      additionalProperties: false
      properties:
        causa:
          anyOf:
          - type: string
          - type: 'null'
          title: Causa
        correccion:
          anyOf:
          - type: string
          - type: 'null'
          title: Correccion
        creado_en:
          format: date-time
          title: Creado En
          type: string
        distancia:
          description: Saltos desde el área.
          maximum: 2.0
          minimum: 0.0
          title: Distancia
          type: integer
        id:
          title: Id
          type: string
        origen:
          enum:
          - ticket
          - postmortem
          - manual
          title: Origen
          type: string
        resumen:
          title: Resumen
          type: string
        similitud:
          anyOf:
          - maximum: 1.0
            minimum: -1.0
            type: number
          - type: 'null'
          description: Coseno con el embedding de la consulta; null si no aplica.
          title: Similitud
        ticket:
          anyOf:
          - type: string
          - type: 'null'
          description: Número del ticket (KC-####) si lo hay.
          title: Ticket
      required:
      - id
      - ticket
      - origen
      - resumen
      - causa
      - correccion
      - distancia
      - similitud
      - creado_en
      title: IncidenteAplicable
      type: object
    JobIn:
      properties:
        prioridad_efectiva:
          pattern: ^P[1-4]$
          title: Prioridad Efectiva
          type: string
        ticket_id:
          title: Ticket Id
          type: string
      required:
      - ticket_id
      - prioridad_efectiva
      title: JobIn
      type: object
    LocIn:
      properties:
        anadidas:
          minimum: 0.0
          title: Anadidas
          type: integer
        eliminadas:
          minimum: 0.0
          title: Eliminadas
          type: integer
        netas:
          title: Netas
          type: integer
        pr_url:
          title: Pr Url
          type: string
        tests:
          default: 0
          minimum: 0.0
          title: Tests
          type: integer
        ticket_id:
          title: Ticket Id
          type: string
      required:
      - ticket_id
      - pr_url
      - anadidas
      - eliminadas
      - netas
      title: LocIn
      type: object
    MigracionIn:
      additionalProperties: false
      description: Paso individual de migración asociado a una spec.
      properties:
        archivo:
          maxLength: 255
          minLength: 1
          pattern: ^[0-9]{3}_[a-z0-9_]+\.sql$
          title: Archivo
          type: string
        descripcion:
          maxLength: 2000
          minLength: 1
          title: Descripcion
          type: string
        rollback:
          maxLength: 2000
          minLength: 1
          title: Rollback
          type: string
      required:
      - archivo
      - descripcion
      - rollback
      title: MigracionIn
      type: object
    NodoAlcanzado:
      additionalProperties: false
      properties:
        distancia:
          description: 0 para las semillas.
          maximum: 5.0
          minimum: 0.0
          title: Distancia
          type: integer
        id:
          title: Id
          type: string
        kind:
          title: Kind
          type: string
        via_tipo:
          anyOf:
          - $ref: '#/components/schemas/TipoArista'
          - type: 'null'
          description: Tipo de la última arista de un camino mínimo; null en las semillas.
      required:
      - id
      - kind
      - distancia
      - via_tipo
      title: NodoAlcanzado
      type: object
    NodoGrafo:
      additionalProperties: false
      properties:
        id:
          title: Id
          type: string
        kind:
          title: Kind
          type: string
      required:
      - id
      - kind
      title: NodoGrafo
      type: object
    NuggetAplicable:
      additionalProperties: false
      properties:
        evidencia_ref:
          title: Evidencia Ref
          type: string
        id:
          title: Id
          type: string
        regla:
          maxLength: 280
          minLength: 1
          title: Regla
          type: string
        relevancia:
          enum:
          - directa
          - alcance
          - general
          title: Relevancia
          type: string
        score:
          maximum: 1.0
          minimum: 0.0
          title: Score
          type: number
        seccion:
          title: Seccion
          type: string
        tipo:
          enum:
          - regla_negocio
          - restriccion_tecnica
          title: Tipo
          type: string
      required:
      - id
      - regla
      - tipo
      - seccion
      - evidencia_ref
      - relevancia
      - score
      title: NuggetAplicable
      type: object
    OnboardingCodeMappingStatusOut:
      description: Contrato versionado v1 del progreso en vivo de ingesta CodeMapping.
      properties:
        commit_sha:
          anyOf:
          - type: string
          - type: 'null'
          title: Commit Sha
        conteo_aristas:
          minimum: 0.0
          title: Conteo Aristas
          type: integer
        conteo_nodos:
          minimum: 0.0
          title: Conteo Nodos
          type: integer
        errores:
          items:
            additionalProperties: true
            type: object
          title: Errores
          type: array
        estado:
          title: Estado
          type: string
