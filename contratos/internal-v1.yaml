              $ref: '#/components/schemas/BusquedaHibridaIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusquedaHibridaOut'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Solicitud inválida.
        '401':
          content:
            application/json:
