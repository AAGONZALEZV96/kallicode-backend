[project]
name = "kallicode-backend"
version = "0.1.0"
description = "Backend Kallicode: API del portal, webhooks e interna del pipeline + workers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "redis>=5.0",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "jsonschema>=4.23",
  "anyio>=4.4",
  "tree-sitter>=0.21.0",
  "FlagEmbedding>=1.2.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=4.1", "ruff>=0.6", "mypy>=1.11", "pgserver>=0.1.4"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# TODO (KC-TECH-01): Deuda técnica heredada. 
# El equipo de backend debe arreglar estos warnings y removerlos de esta lista de ignorados.
ignore = [
    "B008", "BLE001", "S110", 
    "SIM102", "F841", "DTZ011", "ISC", "B039", "DTZ005", "PYI034", "E702"
]

[tool.mypy]
python_version = "3.12"
# TODO (KC-TECH-02): Deuda técnica de tipado estricto.
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false
strict_optional = false
# Bypass de errores específicos heredados
disable_error_code = ["attr-defined", "index", "assignment", "call-arg", "misc", "arg-type"]
# Aislamos las aplicaciones de negocio para que cada equipo las arregle en su propio sprint
exclude = [
    "^apps/api/",
    "^apps/workers/",
    "^conftest\\.py$"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Scope global necesario para mantener vivas las conexiones async a PostgreSQL
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "integracion: pruebas que requieren PostgreSQL real (no unitarias)",
]

[tool.uv.workspace]
members = ["packages/core", "apps/api", "apps/workers", "packages/codemapping", "packages/testing"]

[tool.setuptools]
py-modules = []