[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
codemapping = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "S",      # flake8-bandit
    "UP",     # pyupgrade
    "RUF",    # reglas de ruff
]
ignore = [
    "S101",   # Permitir asserts
    "S603",   # Subprocess call check (usado en git clone / git diff)
    "S607",   # Partial executable path ('git' en el PATH)
    "S324",   # Uso no criptográfico de sha1 para IDs de AST
]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "tree_sitter_languages",
    "tree_sitter_languages.*",
    "FlagEmbedding",
    "FlagEmbedding.*",
    "neo4j",
    "neo4j.*",
    "qdrant_client",
    "qdrant_client.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
