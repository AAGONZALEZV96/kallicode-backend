[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
codemapping = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 120  # Amplía a 120 para admitir JSON schemas y prompts sin desbordar

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "S",
    "UP",
    "RUF",
]
ignore = [
    "S101",   # Permitir asserts en pruebas
    "S603",   # Subprocess checks
    "S607",   # Partial executable paths
    "S324",   # sha1 no criptográfico
    "RUF001", # Caracteres ambiguos en strings (guiones en dash)
    "RUF002", # Caracteres ambiguos en docstrings
    "RUF003", # Caracteres ambiguos en comentarios
    "B039",   # ContextVar mutable default en logging base
    "B904",   # Permitir raise sin 'from' en convertidores de excepciones
]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "tree_sitter_languages",
    "tree_sitter_languages.*",
    "FlagEmbedding",
    "FlagEmbedding.*",
    "neo4j",
    "neo4j.*",
    "qdrant_client",
    "qdrant_client.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.6",
]
