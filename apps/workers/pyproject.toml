[project]
name = "kallicode-workers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "kallicode-core",
    "codemapping",
    "reportlab>=4.2,<5",
]

[tool.uv.sources]
kallicode-core = { workspace = true }
codemapping = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kallicode_workers"]
