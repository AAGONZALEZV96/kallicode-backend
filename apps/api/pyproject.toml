[project]
name = "kallicode-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "kallicode-core",
    "fastapi>=0.111.0",
    "pydantic[email]>=2.7.0",
    "email-validator>=2.1.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "azure-storage-blob>=12.30.3",
    "azure-identity>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyyaml>=6.0.0",
]

[tool.uv.sources]
kallicode-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kallicode_api"]