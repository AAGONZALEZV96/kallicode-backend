version: "3.8"

services:
  postgres:
    build: ./db/postgres
    image: kallicode-postgres:16
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,pg_partman_bgw
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_partman_bgw.interval=3600
      - -c
      - pg_partman_bgw.dbname=kallicode
      - -c
      - pg_partman_bgw.role=kallicode_admin
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
      POSTGRES_DB: kallicode
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d kallicode
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --requirepass
      - ${KC_REDIS_PASSWORD}
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${KC_REDIS_PASSWORD}" ping
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      KC_REDIS_PASSWORD: ${KC_REDIS_PASSWORD}

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --loose
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data
    healthcheck:
      test:
        - CMD
        - nc
        - -z
        - localhost
        - "10000"
      interval: 5s
      timeout: 3s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test:
        - CMD-SHELL
        - clamdscan --ping 3
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:8025/api/v1/info
      interval: 5s
      timeout: 3s
      retries: 5

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    platform: linux/amd64
    command:
      - --model-id
      - BAAI/bge-m3
    ports:
      - "8080:80"
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:80/health
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  azurite_data:
  clamav_data: