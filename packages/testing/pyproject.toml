[project]
name = "kallicode-testing"
version = "0.1.0"
requires-python = ">=3.12"
description = "Utilidades compartidas de testing para kallicode"
dependencies = [
    "azure-storage-blob>=12.30.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kallicode_testing"]
