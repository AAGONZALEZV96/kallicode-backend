[project]
name = "kallicode-testing"
version = "0.1.0"
requires-python = ">=3.12"
description = "Utilidades compartidas de testing para kallicode"
dependencies = [
    "azure-storage-blob>=12.30.3",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "playwright>=1.42.0",
    "pytest-playwright>=0.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "respx>=0.21.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kallicode_testing"]