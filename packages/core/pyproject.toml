[project]
name = "kallicode-core"
version = "0.1.0"
requires-python = ">=3.12"
# KC-PLT-01-2: Dependencias formales y estrictas del núcleo
dependencies = [
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "redis>=5.0",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "argon2-cffi>=23.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kallicode_core"]