[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codemapping"
version = "0.1.0"
description = "Motor determinista y enriquecimiento semántico de código para KalliCode"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "openai>=1.20.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "tree-sitter<0.22",
    "tree-sitter-languages>=1.10.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kallicode_codemapping"]


# ---------------------------------------------------------------------------
# Pruebas de mutación (KC-CM-06-6) -- mutmut >= 3.8, solo Linux/macOS/WSL.
#   cd packages/codemapping && uv run --with "mutmut>=3.8,<4" mutmut run
# Alcance: módulos de lógica pura con pruebas unitarias sin base de datos.
# Detalle y resultados: docs/calidad/mutacion_codemapping.md
# ---------------------------------------------------------------------------
[tool.mutmut]
source_paths = ["src"]
only_mutate = [
    "src/kallicode_codemapping/budget.py",
    "src/kallicode_codemapping/checkpoints.py",
    "src/kallicode_codemapping/embeddings.py",
    "src/kallicode_codemapping/tenant_thresholds.py",
]
also_copy = ["mutmut_pytest.ini"]
pytest_add_cli_args = ["-c", "mutmut_pytest.ini"]
pytest_add_cli_args_test_selection = [
    "test/test_budget_dry_run.py",
    "test/test_tenant_threshold.py",
    "test/test_infraestructura_unit.py",
    "test/test_embeddings_tei.py",
    "test/test_mutacion_dirigida.py",
    "test/test_refresco_presupuesto_docs.py",
]
