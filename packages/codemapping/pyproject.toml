[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codemapping"
version = "0.1.0"
description = "Motor determinista y enriquecimiento semántico de código para KalliCode"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "openai>=1.20.0",
    "sqlalchemy>=2.0.0",
    "tree-sitter-languages>=1.10.0",
    "FlagEmbedding>=1.2.0",
    "qdrant-client>=1.9.0",
    "neo4j>=5.19.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codemapping"]