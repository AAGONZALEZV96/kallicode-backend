[project]
name = "kallicode-codemapping"
version = "0.1.0"
description = "CodeMapping knowledge graph engine for KalliCode"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.21.3",
    "tree-sitter-language-pack>=0.21.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kallicode_codemapping"]