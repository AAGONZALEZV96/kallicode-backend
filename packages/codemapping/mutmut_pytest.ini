# Configuración de pytest EXCLUSIVA de las corridas de mutmut (KC-CM-06-6).
#
# mutmut copia el paquete a `mutants/` y ejecuta pytest desde ahí. Sin un
# archivo de configuración propio, pytest sube hasta el pyproject.toml raíz,
# cuyo `pythonpath` apunta al código ORIGINAL (packages/codemapping/src): las
# pruebas importarían el código sin mutar y mutmut reportaría "no tests".
# Este archivo fija `pythonpath` relativo a `mutants/` para que se importe la
# copia mutada.
[pytest]
addopts = --import-mode=importlib
pythonpath = src ../../core/src
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    integracion: pruebas que requieren PostgreSQL real (no unitarias)
